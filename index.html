 const lineRows=(snap.lines||[]).map((l,n)=>`<tr><td>${n+1}</td><td>${esc(l.label)}</td><td>${money(l.annual)}</td><td>${money(l.accrued)}</td><td>${money(l.paid)}</td><td>${l.balance>=0?'له '+money(l.balance):'عليه '+money(Math.abs(l.balance))}</td></tr>`).join('');
 const extraRows=[
  ...(snap.deductions||[]).map(d=>({label:d.label||'خصم',value:-Number(d.amount||0)})),
  ...(snap.custom||[]).map(r=>({label:r.name,value:r.kind==='tenant_credit'?Number(r.calculated||0):-Number(r.calculated||0)}))
 ];
 return `<div class="settlement-doc">
  <h2>سند تصفية حساب مستأجر</h2>
  <table><tbody>
   <tr><th>رقم التصفية</th><td>${esc(code)}</td><th>المستأجر</th><td>${esc(t?.name||'—')}</td></tr>
   <tr><th>رقم الهوية / الإقامة</th><td>${esc(t?.nationalId||'—')}</td><th>العقد</th><td>${esc(c?.contractNo||c?.code||'—')}</td></tr>
   <tr><th>العقار</th><td>${esc(p?.name||'—')}</td><th>الوحدة</th><td>${esc(u?.code||u?.unitNo||'—')}</td></tr>
   <tr><th>المالك</th><td>${esc(o?.name||'—')}</td><th>تاريخ الإخلاء</th><td>${esc(snap.exitDate||'—')}</td></tr>
   <tr><th>مدة الإشغال</th><td>${snap.usedDays||0} يوم</td><th>الأيام المتبقية</th><td>${snap.remainingDays||0} يوم</td></tr>
  </tbody></table>
  <h3 style="margin-top:14px">تفاصيل الإيجار والبنود</h3>
  <table><thead><tr><th>م</th><th>البند</th><th>القيمة السنوية</th><th>المستحق</th><th>المدفوع</th><th>الرصيد</th></tr></thead><tbody>${lineRows}</tbody></table>
  <h3 style="margin-top:14px">التأمين والتسويات</h3>
  <table><tbody>
   <tr><th>مبلغ التأمين</th><td>${money(snap.deposit)}</td></tr>
   ${extraRows.map(r=>`<tr><th>${esc(r.label)}</th><td>${r.value>=0?'إضافة ':'خصم '}${money(Math.abs(r.value))}</td></tr>`).join('')}
  </tbody></table>
  <div class="doc-result">${snap.net>=0?`صافي المبلغ المستحق للمستأجر: ${money(snap.net)}`:`صافي المبلغ المطلوب من المستأجر: ${money(Math.abs(snap.net))}`}</div>
  ${snap.notes?`<div><b>ملاحظات:</b> ${esc(snap.notes)}</div>`:''}
 </div>`;
}
function previewCurrentSettlement(){

 openModal('معاينة سند التصفية',settlementDocumentBody(snap,'معاينة'));
}
function printCurrentSettlement(){
 const snap=settlementSnapshot();if(!snap){flash('اختر المستأجر والعقد أولًا');return}
 printStandardDocument('سند تصفية حساب مستأجر',settlementDocumentBody(snap,'معاينة'),'تصفية الإيجار والتأمين والمستحقات');
}
function exportCurrentSettlementXlsx(){
 const snap=settlementSnapshot();if(!snap){flash('اختر المستأجر والعقد أولًا');return}
 const t=getTenant(snap.tenantId),c=getContract(snap.contractId);
 const rows=[['المستأجر','كود المستأجر','العقد','تاريخ الإخلاء','البند','القيمة السنوية','المستحق','المدفوع','الرصيد']];
 (snap.lines||[]).forEach(l=>rows.push([t?.name||'',t?.code||'',c?.contractNo||'',snap.exitDate,l.label,Number(l.annual||0),Number(l.accrued||0),Number(l.paid||0),Number(l.balance||0)]));
 rows.push([t?.name||'',t?.code||'',c?.contractNo||'',snap.exitDate,'التأمين',Number(snap.deposit||0),'','','']);
 rows.push([t?.name||'',t?.code||'',c?.contractNo||'',snap.exitDate,'صافي التصفية','','','',Number(snap.net||0)]);
 downloadXlsx(rows,'تصفية_حساب_مستأجر.xlsx','تصفية المستأجر');
}

function openSavedSettlement(id){
 const r=getTenantSettlements().find(x=>String(x.id)===String(id));if(!r)return;
 openModal('سند تصفية حساب مستأجر',`${settlementDocumentBody(r,r.code)}<div class="settle-actions"><button class="btn gold" onclick="printSavedSettlement('${r.id}')">طباعة / PDF</button></div>`);
}
function printSavedSettlement(id){
 const r=getTenantSettlements().find(x=>String(x.id)===String(id));if(!r)return;
 printStandardDocument('سند تصفية حساب مستأجر',settlementDocumentBody(r,r.code),`رقم التصفية: ${esc(r.code)}`);
 audit('طباعة سند تصفية مستأجر','إدارة المستأجرين',r.code,'');
}
function deleteSavedSettlement(id){
 if(!requireDelete())return;
 const r=getTenantSettlements().find(x=>String(x.id)===String(id));if(!r)return;
 if(!confirm('هل تريد حذف عملية التصفية المحفوظة؟'))return;
 db.tenantSettlements=getTenantSettlements().filter(x=>String(x.id)!==String(id));save();
 audit('حذف تصفية حساب مستأجر','إدارة المستأجرين',r.code||String(r.id),'');
 closeModal();renderSettlementHistory();flash('تم حذف التصفية');
}

function ensureTreasuryData(){
 if(!Array.isArray(db.treasuries))db.treasuries=[];
 if(!Array.isArray(db.treasuryMovements))db.treasuryMovements=[];
}
function treasuryById(id){
 ensureTreasuryData();
 return db.treasuries.find(x=>String(x.id)===String(id));
}
function treasuryMovementsFor(id){
 ensureTreasuryData();
 return db.treasuryMovements
  .filter(x=>String(x.treasuryId)===String(id))
  .sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')) || String(b.createdAt||'').localeCompare(String(a.createdAt||'')));
}
function treasuryTotals(id){
 const rows=treasuryMovementsFor(id);
 const incoming=rows.filter(x=>x.type==='in').reduce((s,x)=>s+Number(x.amount||0),0);
 const outgoing=rows.filter(x=>x.type==='out').reduce((s,x)=>s+Number(x.amount||0),0);
 return {incoming,outgoing,balance:incoming-outgoing,count:rows.length};
}
function treasuryStatusBadge(active){
 return active!==false?'<span class="badge good">نشطة</span>':'<span class="badge bad">غير نشطة</span>';
}

function saveTreasury(editId=''){
 ensureTreasuryData();
 if(editId && !requireManager())return;

 const name=document.getElementById('tr_name')?.value.trim();
 const label=document.getElementById('tr_label')?.value.trim();
 const accountOrIban=document.getElementById('tr_account')?.value.trim();
 const description=document.getElementById('tr_description')?.value.trim();
 const active=document.getElementById('tr_active')?.value!=='0';

 if(!name){flash('أدخل اسم الخزينة');return}
 const duplicate=db.treasuries.find(x=>x.name.trim().toLowerCase()===name.toLowerCase() && String(x.id)!==String(editId||''));
 if(duplicate){flash('يوجد خزينة أخرى بنفس الاسم');return}

 if(editId){
  const item=treasuryById(editId);if(!item)return;
  item.name=name;item.label=label;item.accountOrIban=accountOrIban;item.description=description;item.active=active;item.updatedAt=nowStamp();
  if(save()===false)return;
  audit('تعديل خزينة','إدارة المالية',item.code||String(item.id),name);
  flash('تم حفظ تعديل الخزينة');
 }else{
  const item={
   id:uid(),code:nextCode('TRY',db.treasuries),name,label,accountOrIban,description,active,

  };
  db.treasuries.unshift(item);

  audit('إضافة خزينة','إدارة المالية',item.code,name);
  flash('تمت إضافة الخزينة');
 }
 renderTreasuries();
}
function deleteTreasury(id){

  :`حذف الخزينة "${item.name}"؟`;
 if(!confirm(msg))return;

 const oldTreasuries=[...db.treasuries],oldMovements=[...db.treasuryMovements];
 db.treasuries=db.treasuries.filter(x=>String(x.id)!==String(id));
 db.treasuryMovements=db.treasuryMovements.filter(x=>String(x.treasuryId)!==String(id));
 if(save()===false){db.treasuries=oldTreasuries;db.treasuryMovements=oldMovements;return}
 audit('حذف خزينة','إدارة المالية',item.code||String(item.id),`${item.name} - حركات محذوفة: ${count}`);
 renderTreasuries();flash('تم حذف الخزينة');
}

function treasuryMovementRowsHTML(treasuryId){

 const asc=[...rows].sort((a,b)=>String(a.date||'').localeCompare(String(b.date||'')) || String(a.createdAt||'').localeCompare(String(b.createdAt||'')));

function ensureFinanceData(){
 ['bankAccounts','bankMovements','expenseCategories','incomeCategories','paymentVouchers','receiptVouchers','cheques','treasuries','treasuryMovements','payments'].forEach(k=>{if(!Array.isArray(db[k]))db[k]=[]});
}
function financePartyName(v){
 if(!v)return '—';
 if(v.partyType==='owner')return getOwner(v.partyId)?.name||v.partyName||'مالك';
 if(v.partyType==='tenant')return getTenant(v.partyId)?.name||v.partyName||'مستأجر';
 return v.partyName||'طرف آخر';
}
function financePartyLabel(type){return type==='owner'?'مالك':type==='tenant'?'مستأجر':'طرف آخر'}
function bankAccountById(id){ensureFinanceData();return db.bankAccounts.find(x=>String(x.id)===String(id))}
function financeAccountName(type,id){
 if(type==='treasury')return treasuryById(id)?.name||'خزينة';
 if(type==='bank')return bankAccountById(id)?.name||'حساب بنكي';
 return 'غير محدد';
}
function financeAccountsOptions(selectedType='',selectedId=''){
 ensureFinanceData();
 return `<option value="">اختر الحساب</option>
 ${db.treasuries.filter(x=>x.active!==false).map(x=>`<option value="treasury:${x.id}" ${selectedType==='treasury'&&String(selectedId)===String(x.id)?'selected':''}>خزينة — ${esc(x.name)}</option>`).join('')}
 ${db.bankAccounts.filter(x=>x.active!==false).map(x=>`<option value="bank:${x.id}" ${selectedType==='bank'&&String(selectedId)===String(x.id)?'selected':''}>بنك — ${esc(x.name)}${x.iban?` — ${esc(x.iban)}`:''}</option>`).join('')}`;
}
function parseFinanceAccount(v){const [accountType,accountId]=String(v||'').split(':');return {accountType:accountType||'',accountId:accountId||''}}
function financeCategoryOptions(kind,selected=''){
 ensureFinanceData();const arr=kind==='expense'?db.expenseCategories:db.incomeCategories;
 return `<option value="">اختر التصنيف</option>${arr.filter(x=>x.active!==false).map(x=>`<option value="${x.id}" ${String(selected)===String(x.id)?'selected':''}>${esc(x.name)}</option>`).join('')}`;
}
function financeTenantContractOptions(tenantId='',selected=''){
 const arr=(db.contracts||[]).filter(c=>!tenantId||String(c.tenantId)===String(tenantId));
 return `<option value="">بدون عقد</option>${arr.map(c=>`<option value="${c.id}" ${String(selected)===String(c.id)?'selected':''}>${esc(c.contractNo||c.code||'عقد')} — ${esc(getUnit(c.unitId)?.code||getUnit(c.unitId)?.unitNo||'')}</option>`).join('')}`;
}
function financeSyncAccountMovement(voucher,kind){
 ensureFinanceData();
 const sourceType=kind==='receipt'?'receiptVoucher':'paymentVoucher',movementType=kind==='receipt'?'in':'out',sourceId=String(voucher.id);
 db.treasuryMovements=db.treasuryMovements.filter(x=>!(x.sourceType===sourceType&&String(x.sourceId)===sourceId));
 db.bankMovements=db.bankMovements.filter(x=>!(x.sourceType===sourceType&&String(x.sourceId)===sourceId));
 if(!voucher.accountType||!voucher.accountId)return;
 const arr=voucher.accountType==='bank'?db.bankMovements:db.treasuryMovements;
 const m={id:uid(),code:nextCode(voucher.accountType==='bank'?'BNM':'TRM',arr),date:voucher.date||today(),type:movementType,amount:Number(voucher.amount||0),description:`${kind==='receipt'?'سند قبض':'سند صرف'} ${voucher.code||''} — ${financePartyName(voucher)}`,reference:voucher.code||'',notes:voucher.notes||'',sourceType,sourceId,createdAt:voucher.createdAt||nowStamp()};
 if(voucher.accountType==='bank')m.bankAccountId=voucher.accountId;else m.treasuryId=voucher.accountId;
 arr.push(m);
}
function financeRemoveAccountMovement(voucherId,kind){
 ensureFinanceData();const sourceType=kind==='receipt'?'receiptVoucher':'paymentVoucher';
 db.treasuryMovements=db.treasuryMovements.filter(x=>!(x.sourceType===sourceType&&String(x.sourceId)===String(voucherId)));
 db.bankMovements=db.bankMovements.filter(x=>!(x.sourceType===sourceType&&String(x.sourceId)===String(voucherId)));
}
function upsertReceiptForPayment(payment,opts={}){
 ensureFinanceData();if(!payment)return null;const c=getContract(payment.contractId);
 let r=db.receiptVouchers.find(x=>String(x.paymentId)===String(payment.id));
 if(!r){r={id:uid(),code:payment.code||nextCode('RCV',db.receiptVouchers),createdAt:nowStamp()};db.receiptVouchers.push(r)}
 const acc=parseFinanceAccount(opts.accountValue||`${payment.accountType||''}:${payment.accountId||''}`);
 Object.assign(r,{paymentId:payment.id,partyType:'tenant',partyId:c?.tenantId||r.partyId||'',contractId:payment.contractId||'',installmentId:payment.installmentId||'',amount:Number(payment.amount||0),date:payment.date||today(),method:payment.method||'نقدي',categoryId:r.categoryId||'',accountType:acc.accountType||payment.accountType||r.accountType||'',accountId:acc.accountId||payment.accountId||r.accountId||'',notes:payment.notes||r.notes||'',description:r.description||'سداد مستأجر',chequeId:opts.chequeId||payment.chequeId||r.chequeId||''});
 payment.receiptVoucherId=r.id;payment.accountType=r.accountType;payment.accountId=r.accountId;payment.chequeId=r.chequeId||'';financeSyncAccountMovement(r,'receipt');return r;
}

function ensureMaintenanceData(){
 if(!Array.isArray(db.maintenanceExpenses))db.maintenanceExpenses=[];
 if(!Array.isArray(db.maintenanceReceipts))db.maintenanceReceipts=[];
 if(!Array.isArray(db.maintenanceTypes))db.maintenanceTypes=[];
 ensureFinanceData();
}
function maintenanceTypeOptions(selected=''){
 ensureMaintenanceData();
 const src=(db.maintenanceTypes||db.maintenanceSettings||[]).filter(Boolean);
 return `<option value="">اختر نوع العملية</option>${src.map(x=>{
  const id=x.id??x.code??x.name;
  const name=x.name??x.title??x.label??String(id);
  return `<option value="${esc(String(id))}" ${String(selected)===String(id)?'selected':''}>${esc(name)}</option>`;
 }).join('')}`;
}
function maintenanceTypeName(id){
 const src=(db.maintenanceTypes||db.maintenanceSettings||[]);
 const x=src.find(x=>String(x.id??x.code??x.name)===String(id));
 return x?.name??x?.title??x?.label??String(id||'—');
}
function maintenanceOwnerOptions(selected=''){
 return `<option value="">اختر المالك</option>${(db.owners||[]).map(o=>`<option value="${o.id}" ${String(selected)===String(o.id)?'selected':''}>${esc(o.name)} — ${esc(o.code||'')}</option>`).join('')}`;
}
function maintenanceTenantOptions(selected=''){
 return `<option value="">اختر المستأجر</option>${(db.tenants||[]).map(t=>`<option value="${t.id}" ${String(selected)===String(t.id)?'selected':''}>${esc(t.name)} — ${esc(t.code||'')}</option>`).join('')}`;
}
function maintenancePropertiesForOwner(ownerId){
 return contractAllProperties().filter(p=>propertyBelongsToOwner(p,ownerId));
}
function maintenanceUnitsForProperty(propertyId){
 return contractAllUnits().filter(u=>contractIdEq(contractPropertyIdOfUnit(u),propertyId));
}
function maintenanceContractsForTenant(tenantId){
 return (db.contracts||[]).filter(c=>String(c.tenantId)===String(tenantId));
}
function maintenanceUnitsForTenant(tenantId){
 const ids=new Set(maintenanceContractsForTenant(tenantId).map(c=>String(c.unitId)));
 return contractAllUnits().filter(u=>ids.has(String(u.id)));
}
function maintenanceOfficeFeeAmount(base,mode,value){
 base=Number(base||0);value=Number(value||0);
 if(mode==='percent')return base*value/100;
 return value;
}
function maintenancePaidAmount(expenseId){
 ensureMaintenanceData();
 return db.maintenanceReceipts
  .filter(r=>Array.isArray(r.lines)&&r.lines.some(l=>String(l.expenseId)===String(expenseId)))
  .reduce((sum,r)=>{
   const line=r.lines.find(l=>String(l.expenseId)===String(expenseId));
   return sum+Number(line?.amount||0);
  },0);
}
function maintenanceExpenseRemaining(x){
 const total=Number(x.amount||0)+Number(x.officeFeeAmount||0);
 return Math.max(0,total-maintenancePaidAmount(x.id));
}

function maintenanceGregorianChanged(){
 const g=document.getElementById('mx_date_g'),h=document.getElementById('mx_date_h');if(!g||!h||!g.value)return;
 try{
  const d=new Date(g.value+'T12:00:00');
  const parts=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d);
  const get=t=>parts.find(p=>p.type===t)?.value||'';
  h.value=`${get('year')}/${get('month')}/${get('day')}`;
 }catch(e){}
}
function maintenanceHijriChanged(){
 const h=document.getElementById('mx_date_h'),g=document.getElementById('mx_date_g');if(!h||!g)return;
 const m=h.value.trim().match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);if(!m)return;
 const hy=+m[1],hm=+m[2],hd=+m[3];
 let lo=new Date((hy+578),0,1),hi=new Date((hy+580),11,31),found=null;
 for(let d=new Date(lo);d<=hi;d.setDate(d.getDate()+1)){
  const parts=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{year:'numeric',month:'numeric',day:'numeric'}).formatToParts(d);
  const y=+parts.find(p=>p.type==='year')?.value,mo=+parts.find(p=>p.type==='month')?.value,da=+parts.find(p=>p.type==='day')?.value;
  if(y===hy&&mo===hm&&da===hd){found=new Date(d);break}
 }
 if(found){g.value=`${found.getFullYear()}-${String(found.getMonth()+1).padStart(2,'0')}-${String(found.getDate()).padStart(2,'0')}`}
}

function ensureEmployeeData(){
 if(!Array.isArray(rawDb.employees))rawDb.employees=[];
 if(!Array.isArray(rawDb.employeePayrolls))rawDb.employeePayrolls=[];
 if(!Array.isArray(rawDb.employeeStatusTypes))rawDb.employeeStatusTypes=[];
 if(!Array.isArray(rawDb.employeeStatusHistory))rawDb.employeeStatusHistory=[];
 let active=rawDb.employeeStatusTypes.find(x=>x.systemKey==='active');
 if(!active){active={id:uid(),code:'EST-ACTIVE',name:'نشط',isActive:true,payrollEligible:true,systemKey:'active',createdAt:nowStamp()};rawDb.employeeStatusTypes.push(active)}
 // ترقية هادئة للموظفين القدامى: إنشاء نقطة بداية للحالة فقط عند عدم وجود سجل.
 rawDb.employees.forEach(emp=>{
  const has=rawDb.employeeStatusHistory.some(h=>String(h.employeeId)===String(emp.id));
  if(!has&&emp.startDate){
   rawDb.employeeStatusHistory.push({id:uid(),code:nextCode('ESH',rawDb.employeeStatusHistory),employeeId:emp.id,statusTypeId:active.id,effectiveDate:emp.startDate,notes:'حالة ابتدائية من تاريخ مباشرة العمل',createdAt:nowStamp()});
  }
 });
}
function employeeById(id){ensureEmployeeData();return db.employees.find(x=>String(x.id)===String(id))}
function payrollById(id){ensureEmployeeData();return db.employeePayrolls.find(x=>String(x.id)===String(id))}
function employeeStatusTypeById(id){ensureEmployeeData();return rawDb.employeeStatusTypes.find(x=>String(x.id)===String(id))}
function employeeActiveStatusType(){ensureEmployeeData();return rawDb.employeeStatusTypes.find(x=>x.systemKey==='active')}
function employeeStatusHistoryRows(employeeId){ensureEmployeeData();return rawDb.employeeStatusHistory.filter(x=>String(x.employeeId)===String(employeeId)).sort((a,b)=>String(a.effectiveDate||'').localeCompare(String(b.effectiveDate||''))||String(a.createdAt||'').localeCompare(String(b.createdAt||'')))}
function employeeStatusHistoryPeriods(employeeId){const rows=employeeStatusHistoryRows(employeeId);return rows.map((h,i)=>({...h,periodEnd:i<rows.length-1?addIsoDays(rows[i+1].effectiveDate,-1):''}))}
function employeeStatusAt(employeeId,date){
 const rows=employeeStatusHistoryRows(employeeId).filter(x=>String(x.effectiveDate||'')<=String(date||today()));
 const h=rows.length?rows[rows.length-1]:null;
 const t=h?employeeStatusTypeById(h.statusTypeId):employeeActiveStatusType();
 return {history:h,type:t||employeeActiveStatusType()};
}
function employeeCurrentStatus(emp){return employeeStatusAt(emp.id,today())}
function employeeStatusBadge(emp){
 const s=employeeCurrentStatus(emp),t=s.type;
 if(!t)return '<span class="badge good">نشط</span>';
 return t.isActive!==false?`<span class="badge good">${esc(t.name)}</span>`:`<span class="badge bad">${esc(t.name)}</span>`;
}
function employeeStatusReasonText(emp){const s=employeeCurrentStatus(emp);return s.type?.name||'نشط'}
function salaryMonthKey(year,month){return `${Number(year)}-${String(Number(month)).padStart(2,'0')}`}
function daysInGregorianMonth(year,month){return new Date(Number(year),Number(month),0).getDate()}
function isoDateParts(s){const m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?{y:+m[1],m:+m[2],d:+m[3]}:null}
function isoLocalDate(y,m,d){return `${String(y).padStart(4,'0')}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
function localDateValue(s){const p=isoDateParts(s);return p?new Date(p.y,p.m-1,p.d):null}
function dateDiffInclusive(a,b){const d1=localDateValue(a),d2=localDateValue(b);if(!d1||!d2||d2<d1)return 0;return Math.floor((d2-d1)/86400000)+1}
function addIsoDays(s,n){const d=localDateValue(s);if(!d)return s;d.setDate(d.getDate()+Number(n||0));return isoLocalDate(d.getFullYear(),d.getMonth()+1,d.getDate())}
function employeeStatusIntervals(emp,year,month){
 const dim=daysInGregorianMonth(year,month),ms=isoLocalDate(year,month,1),me=isoLocalDate(year,month,dim);
 let start=ms,end=me;if(emp.startDate&&emp.startDate>start)start=emp.startDate;if(emp.endDate&&emp.endDate<end)end=emp.endDate;
 if(start>end)return {monthStart:ms,monthEnd:me,segments:[],eligibleDays:0,excludedDays:0};
 const events=employeeStatusHistoryRows(emp.id);
 const cuts=[start];
 events.forEach(h=>{if(h.effectiveDate>start&&h.effectiveDate<=end)cuts.push(h.effectiveDate)});
 cuts.sort();
 const uniq=[...new Set(cuts)],segments=[];
 uniq.forEach((from,i)=>{
  const to=i<uniq.length-1?addIsoDays(uniq[i+1],-1):end;
  const st=employeeStatusAt(emp.id,from),type=st.type||employeeActiveStatusType();
  const days=dateDiffInclusive(from,to),eligible=type?.payrollEligible!==false;
  segments.push({from,to,days,statusTypeId:type?.id||'',statusName:type?.name||'نشط',isActive:type?.isActive!==false,payrollEligible:eligible,notes:st.history?.notes||''});
 });
 const eligibleDays=segments.filter(x=>x.payrollEligible).reduce((a,x)=>a+x.days,0),excludedDays=segments.filter(x=>!x.payrollEligible).reduce((a,x)=>a+x.days,0);
 return {monthStart:ms,monthEnd:me,start,end,segments,eligibleDays,excludedDays};
}
function payrollCalculatedPeriod(emp,year,month){
 const dim=daysInGregorianMonth(year,month),status=employeeStatusIntervals(emp,year,month),monthly=Number(emp.monthlySalary||0),daily=dim?monthly/dim:0;
 const included=status.segments.filter(x=>x.payrollEligible),from=included.length?included[0].from:'',to=included.length?included[included.length-1].to:'';
 return {monthStart:status.monthStart,monthEnd:status.monthEnd,from,to,daysInMonth:dim,workedDays:status.eligibleDays,eligibleDays:status.eligibleDays,excludedDays:status.excludedDays,dailyRate:daily,amount:Math.round(daily*status.eligibleDays*100)/100,monthlySalary:monthly,statusSegments:status.segments};
}
function employeeEligibleForMonth(emp,year,month){const dim=daysInGregorianMonth(year,month),ms=isoLocalDate(year,month,1),me=isoLocalDate(year,month,dim);if(emp.startDate&&emp.startDate>me)return false;if(emp.endDate&&emp.endDate<ms)return false;return true}
function payrollStatusBadge(x){return x.paid===true?'<span class="badge good">مسدد</span>':'<span class="badge bad">غير مسدد</span>'}
function payrollSegmentsText(x){
 const segs=Array.isArray(x.statusSegments)?x.statusSegments:[];if(!segs.length)return '—';
 return segs.map(s=>`${s.from} ← ${s.to}: ${s.statusName} (${s.payrollEligible?'يُحتسب':'لا يُحتسب'})`).join(' | ');
}

function employeeReportIsoDate(v){return String(v||'').slice(0,10)}
function employeeReportInRange(v,from,to){const d=employeeReportIsoDate(v);if(!d)return false;return (!from||d>=from)&&(!to||d<=to)}
function employeeReportOverlaps(start,end,from,to){start=employeeReportIsoDate(start);end=employeeReportIsoDate(end);if(from&&end&&end<from)return false;if(to&&start&&start>to)return false;return true}
function employeeReportData(from='',to=''){
 ensureEmployeeData();
 const employees=[...(db.employees||[])];
 const added=employees.filter(e=>employeeReportInRange(e.createdAt||e.startDate,from,to));
 const activeAtEnd=employees.filter(e=>employeeReportOverlaps(e.startDate,e.endDate,'',to)&&employeeStatusAt(e.id,to||today()).type?.isActive!==false);
 const ended=employees.filter(e=>e.endDate&&employeeReportInRange(e.endDate,from,to));
 const statusMoves=(db.employeeStatusHistory||[]).filter(h=>employeeReportInRange(h.effectiveDate,from,to)).sort((a,b)=>String(a.effectiveDate||'').localeCompare(String(b.effectiveDate||'')));
 const payrolls=(db.employeePayrolls||[]).filter(p=>{
  const y=Number(p.year||String(p.monthKey||'').slice(0,4)),m=Number(p.month||String(p.monthKey||'').slice(5,7));
  if(!y||!m)return employeeReportInRange(p.paymentDate||p.createdAt,from,to);
  const ms=isoLocalDate(y,m,1),me=isoLocalDate(y,m,daysInGregorianMonth(y,m));return employeeReportOverlaps(ms,me,from,to);
 }).sort((a,b)=>String(a.monthKey||'').localeCompare(String(b.monthKey||''))||String(employeeById(a.employeeId)?.name||'').localeCompare(String(employeeById(b.employeeId)?.name||''),'ar'));
 const paid=payrolls.filter(p=>p.paid===true),unpaid=payrolls.filter(p=>p.paid!==true);
 const dueTotal=payrolls.reduce((s,p)=>s+Number(p.amount||0),0),paidTotal=paid.reduce((s,p)=>s+Number(p.amount||0),0),unpaidTotal=unpaid.reduce((s,p)=>s+Number(p.amount||0),0);
 return {employees,added,activeAtEnd,ended,statusMoves,payrolls,paid,unpaid,dueTotal,paidTotal,unpaidTotal};
}

function ensureRentalCRMData(){

function crmOptions(list,selected='',first='اختر'){
 const vals=[...new Set((list||[]).filter(Boolean))]; if(selected&&!vals.includes(selected))vals.unshift(selected);
 return `<option value="">${esc(first)}</option>`+vals.map(v=>`<option value="${esc(v)}" ${String(v)===String(selected)?'selected':''}>${esc(v)}</option>`).join('');
}
function rentalOfferLabel(x){
 if(!x)return '—';
 if(x.sourceType==='internal'){
  const p=(rawDb.properties||[]).find(v=>String(v.id)===String(x.propertyId));
  const u=(rawDb.units||[]).find(v=>String(v.id)===String(x.unitId));
  return [p?.name||x.propertyName,u?`الوحدة ${u.unitNo}`:''].filter(Boolean).join(' / ')||x.propertyName||'عرض داخلي';
 }

function suggestedOffersForRequest(r){let rows=[...(db.rentalOffers||[])].filter(x=>x.status==='متاح');return rows.map(x=>{let score=0;if(r.propertyType&&x.propertyType===r.propertyType)score+=3;if(r.unitType&&x.unitType===r.unitType)score+=3;if(r.city&&String(x.city||'').includes(r.city))score+=2;if(r.district&&String(x.district||'').includes(r.district))score+=3;if(r.maxBudget&&Number(x.askingRent||0)<=Number(r.maxBudget))score+=2;if(r.minBudget&&Number(x.askingRent||0)>=Number(r.minBudget)*0.7)score+=1;if(r.bedrooms&&Number(x.bedrooms||0)>=Number(r.bedrooms))score+=1;return {x,score}}).sort((a,b)=>b.score-a.score)}

function archiveFileVisibleToCurrentUser(f){
 if(roleKey()!=='owner')return true;const oid=ownerScopeId();if(!oid)return false;
 if(f.scope==='owner')return String(f.entityId||'')===oid;
 if(f.scope==='property'){const p=(rawDb.properties||[]).find(x=>String(x.id)===String(f.entityId));return propertyOwnedByScopeRaw(p,oid)}
 if(f.scope==='unit'){const u=(rawDb.units||[]).find(x=>String(x.id)===String(f.entityId));const p=rawPropertyForUnit(u);return propertyOwnedByScopeRaw(p,oid)}
 if(f.scope==='tenant'){const tid=String(f.entityId||'');return (rawDb.contracts||[]).some(c=>String(c.tenantId)===tid&&rawContractOwned(c,oid))}
 return false;
}
function recycleVisibleToCurrentUser(r){
 if(roleKey()!=='owner')return true;const oid=ownerScopeId(),d=r?.data||{};if(!oid)return false;
 if(r.collection==='owners')return String(d.id||'')===oid;
 if(r.collection==='properties')return propertyOwnedByScopeRaw(d,oid);
 if(r.collection==='units'){const p=(rawDb.properties||[]).find(x=>String(x.id)===String(d.propertyId));return propertyOwnedByScopeRaw(p,oid)}
 if(r.collection==='contracts')return rawContractOwned(d,oid);
 if(String(d.ownerId||d.sellerOwnerId||d.linkedOwnerId||'')===oid)return true;
 if(d.propertyId){const p=(rawDb.properties||[]).find(x=>String(x.id)===String(d.propertyId));if(propertyOwnedByScopeRaw(p,oid))return true}
 if(d.unitId){const u=(rawDb.units||[]).find(x=>String(x.id)===String(d.unitId));if(propertyOwnedByScopeRaw(rawPropertyForUnit(u),oid))return true}
 if(d.contractId){const c=(rawDb.contracts||[]).find(x=>String(x.id)===String(d.contractId));if(rawContractOwned(c,oid))return true}
 return false;
}

function recycleRecord(id){ensureArchiveData();return (rawDb.recycleBin||[]).find(x=>String(x.id)===String(id))}
function recycleConflictMessage(r){
 if(r.collection!=='contracts')return '';
 const c=r.data||{};if(!c.unitId||!c.startDate||!c.endDate)return '';
 const clash=(rawDb.contracts||[]).find(x=>String(x.id)!==String(c.id)&&String(x.unitId)===String(c.unitId)&&x.startDate&&x.endDate&&String(x.startDate)<=String(c.endDate)&&String(x.endDate)>=String(c.startDate)&&!contractHasSettlement(x));
 if(!clash)return '';
 const u=(rawDb.units||[]).find(x=>String(x.id)===String(c.unitId));const p=(rawDb.properties||[]).find(x=>String(x.id)===String(u?.propertyId));
 return `لا يمكن استرجاع العقد لأن الوحدة «${u?.unitNo||u?.code||'الوحدة'}» في العقار «${p?.name||'العقار'}» مرتبطة بعقد آخر متداخل زمنيًا (${clash.startDate} إلى ${clash.endDate}).`;
}
function restoreRecycle(id){
 if(!requireDelete())return;ensureArchiveData();const r=recycleRecord(id);if(!r)return;const conflict=recycleConflictMessage(r);if(conflict){alert(conflict);return}
 const batch=(rawDb.recycleBin||[]).filter(x=>String(x.batchId)===String(r.batchId));const restoreRows=r.collection==='contracts'?batch:[r];
 for(const z of restoreRows){if(!Array.isArray(rawDb[z.collection]))rawDb[z.collection]=[];const exists=rawDb[z.collection].some(x=>String(x?.id??x?.code)===String(z.recordId));if(!exists)rawDb[z.collection].push(structuredClone(z.data))}
 const ids=new Set(restoreRows.map(x=>String(x.id)));rawDb.recycleBin=rawDb.recycleBin.filter(x=>!ids.has(String(x.id)));save({skipRecycle:true});
 // normalize unit occupancy if contract restored
 if(r.collection==='contracts'){const c=r.data||{},u=(rawDb.units||[]).find(x=>String(x.id)===String(c.unitId));if(u&&contractState(c)==='ساري')u.status='مؤجرة';save({skipRecycle:true})}

function saveSettingItem(editId=''){
 if(arguments[0] && !requireManager())return;
 const name=document.getElementById('set_name').value.trim();
 const custom=document.getElementById('set_custom_category').value.trim();
 const selected=document.getElementById('set_category').value.trim();
 const category=custom||selected;
 if(!name){flash('أدخل اسم الإعداد');return}
 if(!category){flash('اختر الفئة أو اكتب فئة جديدة');return}
 const items=getSettingsItems();
 if(editId){
  const item=items.find(x=>String(x.id)===String(editId));
  if(!item)return;
  item.name=name;item.category=category;item.updatedAt=nowStamp();
  save();
  audit('تعديل إعداد','الإعدادات العامة',item.code||String(item.id),`${category} - ${name}`);
  flash('تم حفظ تعديل الإعداد');
 }else{
  const item={id:uid(),code:nextCode('SET',items),name,category,createdAt:nowStamp()};
  items.unshift(item);save();
  audit('إضافة إعداد','الإعدادات العامة',item.code,`${category} - ${name}`);
  flash('تمت إضافة الإعداد');
 }
 renderSettingsList();
}

}

 if(db.districts.some(x=>String(x.cityId)===String(cityId)&&x.name.trim()===name)){flash('هذا الحي مسجل بالفعل داخل المدينة');return}

}

function normalizeIBAN(v){

}
function saveBank(editId=''){
 if(arguments[0] && !requireManager())return;
 const name=document.getElementById('bank_name').value.trim();
 const shortName=document.getElementById('bank_short').value.trim();
 const currencyCode=document.getElementById('bank_currency').value.trim().toUpperCase();
 const accountNumber=document.getElementById('bank_account').value.trim();
 const iban=normalizeIBAN(document.getElementById('bank_iban').value);

 if(!name){flash('أدخل اسم البنك');return}
 if(!shortName){flash('أدخل الاسم المختصر للبنك');return}
 if(!currencyCode){flash('أدخل رمز / كود العملة');return}
 if(!accountNumber){flash('أدخل رقم الحساب');return}
 if(!iban){flash('أدخل رقم IBAN');return}

 const banks=getBanks();
 const duplicate=banks.find(x=>String(x.id)!==String(editId) && (normalizeIBAN(x.iban)===iban || String(x.accountNumber).trim()===accountNumber));
 if(duplicate){flash('رقم الحساب أو IBAN مسجل بالفعل');return}

 if(editId){
  const b=banks.find(x=>String(x.id)===String(editId));
  if(!b)return;
  b.name=name;b.shortName=shortName;b.currencyCode=currencyCode;b.accountNumber=accountNumber;b.iban=iban;b.updatedAt=nowStamp();
  save();
  audit('تعديل إعداد بنك','الإعدادات العامة',b.code||String(b.id),`${name} - ${accountNumber}`);
  renderBankSettings();
  flash('تم حفظ تعديل بيانات البنك');
 }else{
  const b={
   id:uid(),
   code:nextCode('BNK',banks),
   name,shortName,currencyCode,accountNumber,iban,
   createdAt:nowStamp()
  };
  banks.unshift(b);
  save();
  audit('إضافة بنك','الإعدادات العامة',b.code,`${name} - ${accountNumber}`);
  renderBankSettings();
  flash('تمت إضافة البنك والحساب');
 }
}
function deleteBank(id){

}

function xlsxColumnName(n){
 let s=''; n++;
 while(n){n--;s=String.fromCharCode(65+(n%26))+s;n=Math.floor(n/26)}
 return s;
}
function xlsxXmlText(v){
 return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function xlsxCrc32(bytes){
 if(!xlsxCrc32.table){
  xlsxCrc32.table=Array.from({length:256},(_,n)=>{
   let c=n;
   for(let k=0;k<8;k++)c=(c&1)?0xEDB88320^(c>>>1):c>>>1;
   return c>>>0;
  });
 }
 let c=0xFFFFFFFF;
 for(const b of bytes)c=xlsxCrc32.table[(c^b)&255]^(c>>>8);
 return (c^0xFFFFFFFF)>>>0;
}
function xlsxU16(n){return [n&255,(n>>>8)&255]}
function xlsxU32(n){return [n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255]}
function xlsxZipStore(files){
 const enc=new TextEncoder(), local=[], central=[];
 let offset=0;
 for(const f of files){
  const name=enc.encode(f.name), data=typeof f.data==='string'?enc.encode(f.data):f.data;
  const crc=xlsxCrc32(data);
  const lh=new Uint8Array([
   0x50,0x4b,0x03,0x04,...xlsxU16(20),...xlsxU16(0),...xlsxU16(0),
   ...xlsxU16(0),...xlsxU16(0),...xlsxU32(crc),...xlsxU32(data.length),...xlsxU32(data.length),
   ...xlsxU16(name.length),...xlsxU16(0),...name
  ]);
  local.push(lh,data);
  const ch=new Uint8Array([
   0x50,0x4b,0x01,0x02,...xlsxU16(20),...xlsxU16(20),...xlsxU16(0),...xlsxU16(0),
   ...xlsxU16(0),...xlsxU16(0),...xlsxU32(crc),...xlsxU32(data.length),...xlsxU32(data.length),
   ...xlsxU16(name.length),...xlsxU16(0),...xlsxU16(0),...xlsxU16(0),...xlsxU16(0),
   ...xlsxU32(0),...xlsxU32(offset),...name
  ]);
  central.push(ch);
  offset+=lh.length+data.length;
 }
 const centralSize=central.reduce((s,x)=>s+x.length,0);
 const end=new Uint8Array([
  0x50,0x4b,0x05,0x06,...xlsxU16(0),...xlsxU16(0),...xlsxU16(files.length),...xlsxU16(files.length),
  ...xlsxU32(centralSize),...xlsxU32(offset),...xlsxU16(0)
 ]);
 const size=offset+centralSize+end.length, out=new Uint8Array(size);
 let p=0;
 for(const x of local){out.set(x,p);p+=x.length}
 for(const x of central){out.set(x,p);p+=x.length}
 out.set(end,p);
 return out;
}

 const sheet=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>

function currentMonthRange(){
 const d=new Date(),y=d.getFullYear(),m=d.getMonth();
 const fmt=x=>`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
 return {from:fmt(new Date(y,m,1)),to:fmt(new Date(y,m+1,0))};
}
function globalTableDateColumns(table){
 const heads=Array.from(table?.querySelectorAll('thead th')||table?.rows?.[0]?.cells||[]);
 const norm=t=>String(t||'').replace(/[⇅▲▼]/g,'').trim();
 let start=-1,end=-1,single=-1;
 heads.forEach((h,i)=>{
  const t=norm(h.textContent);
  if(start<0 && /^(البداية|بداية|من|تاريخ البداية|بداية العقد|سارية من|مطلوب من)$/i.test(t))start=i;
  if(end<0 && /^(النهاية|نهاية|إلى|الى|تاريخ النهاية|نهاية العقد|نهاية \/ إخلاء|إلى تاريخ|الى تاريخ)$/i.test(t))end=i;
  if(single<0 && /التاريخ|تاريخ|date|الاستحقاق|المباشرة|تاريخ الحذف/i.test(t))single=i;
 });
 if(start>=0&&end>=0)return {mode:'range',start,end};
 if(single>=0)return {mode:'single',single};
 if(start>=0)return {mode:'single',single:start};
 if(end>=0)return {mode:'single',single:end};
 return {mode:'none',single:-1};
}
function globalTableDateColumn(table){const d=globalTableDateColumns(table);return d.mode==='range'?d.start:d.single}

  .filter(x=>!x.closest('[data-universal-period="1"]')&&!x.closest('[data-universal-data-tools="1"]'));

  const field=x.closest('.field')||x.parentElement;
  const label=String(field?.querySelector?.('label')?.textContent||x.getAttribute('aria-label')||'').trim();
  if(!from && (/^من(?:\s|$)/.test(label)||/من تاريخ|تاريخ البداية|بداية الفترة/.test(label)))from=x;
  if(!to && (/^(إلى|الى)(?:\s|$)/.test(label)||/إلى تاريخ|الى تاريخ|تاريخ النهاية|نهاية الفترة/.test(label)))to=x;
 });
 return {from,to};
}
function pageHasPrimaryDateRange(){const r=primaryDateRangeInputs();return !!(r.from&&r.to)}

function parseUniversalDate(v){
 const s=String(v||'').trim();let m=s.match(/(20\d{2}|19\d{2})[-\/.](\d{1,2})[-\/.](\d{1,2})/);if(!m)return '';
 return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
}
function applyUniversalTableFilters(){
 const table=currentExportTable();if(!table)return;
 const q=String(document.getElementById('globalTableSearch')?.value||'').trim().toLowerCase();
 const from=document.getElementById('globalTableFrom')?.value||'',to=document.getElementById('globalTableTo')?.value||'';
 const dateInfo=globalTableDateColumns(table);
 const bodies=table.tBodies?.length?Array.from(table.tBodies):[];let rows=bodies.length?bodies.flatMap(b=>Array.from(b.rows)):Array.from(table.rows||[]).slice(1);
 rows.forEach(r=>{
  const text=(r.textContent||'').toLowerCase(),matchText=!q||text.includes(q);let matchDate=true;
  if((from||to)&&dateInfo.mode==='range'){
   const a=parseUniversalDate(r.cells?.[dateInfo.start]?.textContent||''),b=parseUniversalDate(r.cells?.[dateInfo.end]?.textContent||'');
   matchDate=!!(a||b) && (!to||!a||a<=to) && (!from||!b||b>=from);
  }else if((from||to)&&dateInfo.mode==='single'){
   const d=parseUniversalDate(r.cells?.[dateInfo.single]?.textContent||'');
   matchDate=!!d&&(!from||d>=from)&&(!to||d<=to);
  }
  r.style.display=(matchText&&matchDate)?'':'none';
 });
}

function savePropertyType(editId=''){
 if(editId && !requireManager())return;
 const name=document.getElementById('property_type_name')?.value.trim();
 if(!name){flash('أدخل مسمى نوع العقار');return}

 const rows=getPropertyTypes();
 const duplicate=rows.find(x=>String(x.id)!==String(editId) && x.name.trim().toLowerCase()===name.toLowerCase());
 if(duplicate){flash('نوع العقار مسجل بالفعل');return}

 if(editId){
  const item=rows.find(x=>String(x.id)===String(editId));
  if(!item)return;
  const oldName=item.name;
  item.name=name;
  item.updatedAt=nowStamp();

  // تحديث العقارات المرتبطة بنفس المسمى حتى لا ينقطع الترابط
  db.properties.forEach(p=>{if(p.type===oldName)p.type=name});

  save();
  audit('تعديل نوع عقار','الإعدادات العامة',item.code||String(item.id),`${oldName} ← ${name}`);
  renderPropertyTypes();
  flash('تم تعديل نوع العقار');
 }else{
  const item={id:uid(),code:nextCode('PTY',rows),name,createdAt:nowStamp()};
  rows.unshift(item);
  save();
  audit('إضافة نوع عقار','الإعدادات العامة',item.code,name);
  renderPropertyTypes();
  flash('تمت إضافة نوع العقار');
 }
}
function deletePropertyType(id){

 const rows=getPropertyTypes();
 const item=rows.find(x=>String(x.id)===String(id));
 if(!item)return;

 if(db.properties.some(p=>p.type===item.name)){
  flash('لا يمكن حذف نوع العقار لأنه مستخدم في عقار مسجل');
  return;
 }
 if(!confirm(`حذف نوع العقار: ${item.name}؟`))return;

 renderPropertyTypes();
 flash('تم حذف نوع العقار');
}

function saveMaintenanceType(editId=''){
 if(editId && !requireManager())return;
 const name=document.getElementById('maintenance_type_name')?.value.trim();
 if(!name){flash('أدخل مسمى نوع الصيانة');return}

 const rows=getMaintenanceTypes();
 const duplicate=rows.find(x=>String(x.id)!==String(editId) && x.name.trim().toLowerCase()===name.toLowerCase());
 if(duplicate){flash('نوع الصيانة مسجل بالفعل');return}

 if(editId){
  const item=rows.find(x=>String(x.id)===String(editId));if(!item)return;
  const oldName=item.name;
  item.name=name;item.updatedAt=nowStamp();

  db.maintenance.forEach(m=>{
   if(m.type===oldName)m.type=name;
   if(m.title===oldName)m.title=name;
  });

  save();
  audit('تعديل نوع صيانة','الإعدادات العامة',item.code||String(item.id),`${oldName} ← ${name}`);
  renderMaintenanceTypes();flash('تم تعديل نوع الصيانة');
 }else{
  const item={id:uid(),code:nextCode('MTY',rows),name,createdAt:nowStamp()};
  rows.unshift(item);save();
  audit('إضافة نوع صيانة','الإعدادات العامة',item.code,name);
  renderMaintenanceTypes();flash('تمت إضافة نوع الصيانة');
 }
}
function deleteMaintenanceType(id){
 if(!requireDelete())return;
 const rows=getMaintenanceTypes();
 const item=rows.find(x=>String(x.id)===String(id));if(!item)return;

 if(db.maintenance.some(m=>m.type===item.name || m.title===item.name)){
  flash('لا يمكن حذف نوع الصيانة لأنه مستخدم في عملية صيانة مسجلة');
  return;
 }
 if(!confirm(`حذف نوع الصيانة: ${item.name}؟`))return;

 db.maintenanceTypes=rows.filter(x=>String(x.id)!==String(id));
 save();
 audit('حذف نوع صيانة','الإعدادات العامة',item.code||String(item.id),item.name);
 renderMaintenanceTypes();flash('تم حذف نوع الصيانة');
}


function getNotificationSettings(){
 const s=db.notificationSettings;
 if(!s || typeof s!=='object')return null;
 return s;
}
function notificationLeadMs(){
 const s=getNotificationSettings();
 if(!s || s.enabled===false)return 0;
 const amount=Math.max(0,Number(s.leadAmount||0));
 const unit=s.leadUnit||'day';
 if(unit==='hour')return amount*3600000;
 if(unit==='day')return amount*86400000;
 if(unit==='week')return amount*7*86400000;
 if(unit==='month')return amount*30*86400000;
 return 0;
}
function notificationLeadLabel(){
 const s=getNotificationSettings();
 if(!s || s.enabled===false)return 'غير مفعّل';
 const n=Number(s.leadAmount||0),u=s.leadUnit||'day';
 const labels={hour:'ساعة',day:'يوم',week:'أسبوع',month:'شهر'};
 return `${n} ${labels[u]||u}`;
}
function notificationReferenceTime(){
 const s=getNotificationSettings();
 return (s?.referenceTime || '09:00').slice(0,5);
}
function eventDateTime(dateStr){
 if(!dateStr)return null;
 const time=notificationReferenceTime();
 const d=new Date(`${dateStr}T${time}:00`);
 return isNaN(d)?null:d;
}
function isUpcomingWithin(dateStr){
 const s=getNotificationSettings();
 if(!s || s.enabled===false)return false;
 const d=eventDateTime(dateStr);if(!d)return false;
 const diff=d.getTime()-Date.now();
 return diff>=0 && diff<=notificationLeadMs();
}

function installmentRemaining(i){return Math.max(0,Number(i.amount||0)-Number(i.paid||0))}
function contractInstallments(c){return db.installments.filter(i=>i.contractId==c.id).sort((a,b)=>String(a.dueDate).localeCompare(String(b.dueDate)))}
function installmentPeriod(i,c){
 const arr=contractInstallments(c),idx=arr.findIndex(x=>x.id==i.id);
 if(idx<0)return {from:c.startDate||i.dueDate,to:c.endDate||i.dueDate};
 const from=i.periodStart||i.dueDate||c.startDate||'';
 let to=i.periodEnd||'';
 if(!to){
  if(arr[idx+1]?.dueDate){
   const d=new Date(arr[idx+1].dueDate+'T00:00:00');d.setDate(d.getDate()-1);to=d.toISOString().slice(0,10);
  }else to=c.endDate||i.dueDate||'';
 }
 return {from,to};
}
function installmentFinancialParts(i,c){
 const base=Number(i.baseAmount ?? i.amount ?? 0);
 const vat=Number(i.vatAmount ?? c.vatAmount ?? 0);
 const electricity=Number(i.electricityAmount ?? i.electricity ?? 0);
 const water=Number(i.waterAmount ?? i.water ?? 0);
 const other=Number(i.otherAmount ?? 0);
 const total=base+vat+electricity+water+other;
 return {base,vat,electricity,water,other,total};
}
function formatReminderDate(d){return d?String(d):'-'}
function whatsappPhone(phone){
 let p=String(phone||'').replace(/\D/g,'');
 if(p.startsWith('00'))p=p.slice(2);
 if(p.startsWith('0'))p='966'+p.slice(1);
 if(p.length===9 && p.startsWith('5'))p='966'+p;
 return p;
}
function installmentWhatsAppMessage(installmentId,mode='upcoming'){
 const i=db.installments.find(x=>x.id==installmentId);if(!i)return '';
 const c=getContract(i.contractId);if(!c)return '';
 const t=getTenant(c.tenantId),u=getUnit(c.unitId),p=getProperty(u?.propertyId);
 const per=installmentPeriod(i,c),f=installmentFinancialParts(i,c);
 const lines=[];
 if(mode==='due'){
  lines.push(`عزيز المستأجر ${t?.name||''}،`);
  lines.push(`نود تذكيرك بأنه تم استحقاق دفعة من الإيجار للوحدة ${u?.unitNo||'-'} بالعقار ${p?.name||'-'}.`);
  lines.push(`العقد رقم: ${c.contractNo||'-'}`);
  lines.push(`فترة القسط: من ${formatReminderDate(per.from)} إلى ${formatReminderDate(per.to)}`);
  lines.push(`تاريخ الاستحقاق: ${formatReminderDate(i.dueDate)}`);
 }else{
  lines.push(`عزيز المستأجر ${t?.name||''}،`);
  lines.push(`للتذكير، نود تذكيرك بقرب حلول قسط الإيجار الخاص بالوحدة ${u?.unitNo||'-'} بالعقار ${p?.name||'-'}.`);
  lines.push(`العقد رقم: ${c.contractNo||'-'}`);
  lines.push(`فترة القسط: من ${formatReminderDate(per.from)} إلى ${formatReminderDate(per.to)}`);
  lines.push(`تاريخ الاستحقاق: ${formatReminderDate(i.dueDate)}`);
 }
 lines.push(`المبلغ الأساسي: ${money(f.base)}`);
 if(f.vat>0)lines.push(`ضريبة القيمة المضافة: ${money(f.vat)}`);
 if(f.electricity>0)lines.push(`كهرباء: ${money(f.electricity)}`);
 if(f.water>0)lines.push(`مياه: ${money(f.water)}`);
 if(f.other>0)lines.push(`بنود أخرى: ${money(f.other)}`);
 lines.push(`إجمالي المبلغ المطلوب: ${money(f.total)}`);
 return lines.join('\n');
}
function sendInstallmentWhatsApp(installmentId,mode='upcoming'){
 const i=db.installments.find(x=>x.id==installmentId),c=i?getContract(i.contractId):null,t=c?getTenant(c.tenantId):null;
 if(!t){flash('تعذر تحديد المستأجر');return}
 const phone=whatsappPhone(t.phone);
 if(!phone){flash('لا يوجد رقم جوال محفوظ للمستأجر');return}
 const msg=installmentWhatsAppMessage(installmentId,mode);
 window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`,'_blank');
 audit('فتح رسالة واتساب للتذكير بالقسط','إدارة التنبيهات',i.code||String(i.id),`${t.name} - ${i.dueDate}`);
}
function reminderRows(type){
 if(type==='overdue_installments')return db.installments.filter(i=>i.dueDate<=today() && installmentRemaining(i)>0);
 if(type==='due_installments')return db.installments.filter(i=>installmentRemaining(i)>0 && isUpcomingWithin(i.dueDate));
 if(type==='ended_unrenewed_contracts')return db.contracts.filter(c=>c.endDate && c.endDate<today() && c.status!=='مجدد' && !contractHasSettlement(c));
 if(type==='contracts_expiring')return db.contracts.filter(c=>c.endDate && isUpcomingWithin(c.endDate) && !contractHasSettlement(c));
 if(type==='eviction_requests')return getEvictionRequests().filter(r=>r.status==='open' && r.vacateDate && (isUpcomingWithin(r.vacateDate)||r.vacateDate<=today()));
 if(type==='installments_period_report')return db.installments.filter(i=>installmentRemaining(i)>0 && isUpcomingWithin(i.dueDate));
 return [];
}

function saveContractClause(editId=''){
 if(editId && !requireManager())return;
 const text=document.getElementById('contract_clause_text')?.value.trim();
 if(!text){flash('اكتب نص البند');return}
 const rows=getContractClauses();
 if(editId){
  const item=rows.find(x=>String(x.id)===String(editId));if(!item)return;
  item.text=text;item.updatedAt=nowStamp();
  save();
  audit('تعديل بند عقد','الإعدادات العامة',item.code||String(item.id),contractClauseTypeLabel(item.type));
  renderContractSettings(item.type);
  flash('تم تعديل بند العقد');
 }else{
  const item={id:uid(),code:nextCode(contractClauseTab==='sale'?'SCL':'RCL',rows),type:contractClauseTab,text,createdAt:nowStamp()};
  rows.push(item);save();
  audit('إضافة بند عقد','الإعدادات العامة',item.code,contractClauseTypeLabel(item.type));
  renderContractSettings(contractClauseTab);
  flash('تمت إضافة بند العقد');
 }
}
function deleteContractClause(id){

 db.contractClauses=rows.filter(x=>String(x.id)!==String(id));
 save();
 audit('حذف بند عقد','الإعدادات العامة',item.code||String(item.id),contractClauseTypeLabel(item.type));
 renderContractSettings(item.type);
 flash('تم حذف بند العقد');

function chooseProgramTheme(theme){

 try{
  const a=(typeof getAppearanceSettings==='function'?getAppearanceSettings():{})||{};
  a.theme=theme;

  else if(db)db.appearanceSettings={...(db.appearanceSettings||{}),theme};

  if(typeof saveAppearanceSettings==='function'){

 }catch(e){

function previewPrintLogo(input){
 const f=input.files&&input.files[0];
 if(!f)return;
 if(f.size>1500000){flash('حجم الشعار كبير. اختر صورة أقل من 1.5 MB');input.value='';return}
 const r=new FileReader();
 r.onload=()=>{
  const box=document.getElementById('ps_logoPreview');
  if(box){box.innerHTML=`<img src="${r.result}" alt="شعار الطباعة">`;box.dataset.logo=r.result}
 };
 r.readAsDataURL(f);
}
function removePrintLogo(){
 const p=getPrintSettings();
 p.logo='';
 save();
 renderPrintSettings();
 flash('تمت إزالة شعار الطباعة');
}
function savePrintSettings(){
 const p=getPrintSettings();
 p.officeName=document.getElementById('ps_officeName').value.trim();
 p.activity=document.getElementById('ps_activity').value.trim();
 p.phone=document.getElementById('ps_phone').value.trim();
 p.email=document.getElementById('ps_email').value.trim();
 p.website=document.getElementById('ps_website').value.trim();
 p.address=document.getElementById('ps_address').value.trim();
 p.falLicense=document.getElementById('ps_falLicense').value.trim();
 p.commercialLicense=document.getElementById('ps_commercialLicense').value.trim();
 const box=document.getElementById('ps_logoPreview');
 if(box&&box.dataset.logo)p.logo=box.dataset.logo;
 save();
 audit('تعديل إعدادات الطباعة','الإعدادات العامة','PRINT-SETTINGS','تحديث بيانات الترويسة المركزية');
 renderPrintSettings();
 flash('تم حفظ إعدادات الطباعة وتحديث الترويسة في جميع المطبوعات');
}
function programPrintHeaderHTML(preview=false){
 const p=getPrintSettings();

  ?`<img src="${p.logo}" alt="شعار المكتب">`
  :`<div style="font-size:26px;font-weight:800;color:#9a7b49">د</div>`;

   p.falLicense?`<div><b>رخصة فال:</b> ${esc(p.falLicense)}</div>`:'',
   p.commercialLicense?`<div><b>الرخصة التجارية:</b> ${esc(p.commercialLicense)}</div>`:'',
   p.activity?`<div><b>النشاط:</b> ${esc(p.activity)}</div>`:''
 ].filter(Boolean).join('');

 if(preview){
  return `<div class="printhead-preview">

   </div>
   <div class="ph-info">${info||'<span class="muted">أدخل بيانات الطباعة لتظهر هنا</span>'}</div>

 }

 return `<div class="global-print-header">

/* =========================================================
   إدارة المخازن — الأصناف والعهد وحركات الاستلام والصرف

function ensureWarehouseData(){
 if(!Array.isArray(rawDb.warehouseItems))rawDb.warehouseItems=[];
 if(!Array.isArray(rawDb.warehouseMovements))rawDb.warehouseMovements=[];
}
function warehouseItemRaw(id){ensureWarehouseData();return rawDb.warehouseItems.find(x=>String(x.id)===String(id))}
function warehouseMovementsFor(itemId){ensureWarehouseData();return rawDb.warehouseMovements.filter(x=>String(x.itemId)===String(itemId)).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))||Number(b.id)-Number(a.id))}
function warehouseQtyIn(itemId){return warehouseMovementsFor(itemId).reduce((s,m)=>s+(m.type==='in'?Number(m.qty||0):m.type==='out'?-Number(m.qty||0):0),0)}
function warehouseStatus(itemId){const q=warehouseQtyIn(itemId);return q>0?'بالمخزن':'مصروف بالكامل'}
function warehouseLinkText(x){
 const p=x?.propertyId?getProperty(x.propertyId):null,u=x?.unitId?getUnit(x.unitId):null,o=x?.ownerId?getOwner(x.ownerId):null;
 return [o?.name,p?.name,u?.number||u?.name].filter(Boolean).join(' / ')||'عام';
}

 <div class="panel"><div class="grid2">
  <div class="field"><label>اسم الصنف / العهدة *</label><input id="wh_name" value="${esc(x?.name||'')}" placeholder="مثال: مفاتيح محل رقم 3"></div>

  <div class="field"><label>الوحدة</label><input id="wh_unit" value="${esc(x?.unit||'قطعة')}" placeholder="قطعة / مجموعة / كرتون"></div>

  <div class="field"><label>العقار المرتبط</label><select id="wh_property" onchange="warehousePropertyChanged()"><option value="">بدون ربط</option>${db.properties.map(p=>`<option value="${p.id}" ${String(x?.propertyId||'')===String(p.id)?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>

function saveWarehouseItem(editId=''){
 if(!requireManager())return;ensureWarehouseData();
 const name=document.getElementById('wh_name').value.trim(),qty=Number(document.getElementById('wh_qty').value||0),date=document.getElementById('wh_received_date').value;
 const statement=document.getElementById('wh_receipt_statement').value.trim();
 if(!name||!date||!statement){flash('أدخل اسم الصنف وتاريخ وبيان الاستلام');return}
 if(!editId && qty<=0){flash('الكمية المستلمة يجب أن تكون أكبر من صفر');return}
 let x=editId?warehouseItemRaw(editId):null,isNew=!x;
 if(!x){x={id:uid(),code:nextCode('WH',rawDb.warehouseItems),createdAt:nowStamp()};rawDb.warehouseItems.unshift(x)}
 Object.assign(x,{name,category:document.getElementById('wh_category').value.trim(),unit:document.getElementById('wh_unit').value.trim()||'قطعة',receivedDate:date,receivedFrom:document.getElementById('wh_received_from').value.trim(),ownerId:document.getElementById('wh_owner').value||'',propertyId:document.getElementById('wh_property').value||'',unitId:document.getElementById('wh_unit_id').value||'',location:document.getElementById('wh_location').value.trim(),receiptStatement:statement,notes:document.getElementById('wh_notes').value.trim(),updatedAt:nowStamp()});
 if(isNew){x.openingQty=qty;rawDb.warehouseMovements.unshift({id:uid(),code:nextCode('WHM',rawDb.warehouseMovements),itemId:x.id,type:'in',qty,date,party:x.receivedFrom||'',statement,createdAt:nowStamp(),createdBy:currentUser.code})}
 save();audit(isNew?'إضافة':'تعديل','إدارة المخازن',x.code,`${isNew?'تسجيل':'تعديل'} الصنف: ${x.name}`);flash('تم حفظ بيانات الصنف');renderWarehouses();
}

 content.innerHTML=`<div class="toolbar"><div><h1>إدارة المخازن</h1><div class="muted">متابعة الأصناف والعهد من لحظة الاستلام حتى الصرف، مع معرفة الموجود حاليًا وسجل كل حركة.</div></div>${canCreateEdit()?`<button class="btn gold" onclick="renderWarehouseItemForm()">＋ تسجيل صنف / عهدة</button>`:''}</div>
 <div class="stats"><div class="stat"><b>${total}</b><span>إجمالي الأصناف</span></div><div class="stat"><b>${available}</b><span>موجود بالمخزن</span></div><div class="stat"><b>${out}</b><span>مصروف بالكامل</span></div></div>

function saveWarehouseMovement(itemId,type){

let auditState={from:'',to:'',search:'',size:10,page:1,hidden:{}};
function auditFiltered(){
 let a=[...(db.auditLogs||[])];
 if(auditState.from)a=a.filter(x=>String(x.createdAt||'').slice(0,10)>=auditState.from);
 if(auditState.to)a=a.filter(x=>String(x.createdAt||'').slice(0,10)<=auditState.to);
 let q=auditState.search.trim().toLowerCase();
 if(q)a=a.filter(x=>[x.code,x.username,x.userName,x.action,x.module,x.entityCode,x.details,x.createdAt].join(' ').toLowerCase().includes(q));
 return a;

function saveUser(id=''){
 if(!requireUserAdmin())return;ensureUsersData();
 const name=String(document.getElementById('usr_name')?.value||'').trim(), username=String(document.getElementById('usr_username')?.value||'').trim(), pass=String(document.getElementById('usr_password')?.value||''), recoveryCode=String(document.getElementById('usr_recovery_code')?.value||'').trim();
 if(!name||!username){flash('أدخل اسم المستخدم واسم الدخول');return}
 if(!id&&!pass){flash('أدخل كلمة المرور للمستخدم الجديد');return}
 if(!recoveryCode){flash('أدخل ID number / رقم الاسترداد للمستخدم');return}
 if(db.users.some(u=>String(u.id)!==String(id)&&String(u.username||'').toLowerCase()===username.toLowerCase())){flash('اسم الدخول مستخدم بالفعل؛ اختر اسمًا آخر');return}
 if(db.users.some(u=>String(u.id)!==String(id)&&String(u.recoveryCode||'').trim().toLowerCase()===recoveryCode.toLowerCase())){flash('ID number / رقم الاسترداد مستخدم لمستخدم آخر؛ أدخل رقمًا فريدًا');return}
 let u=id?db.users.find(x=>String(x.id)===String(id)):null;
 if(!u){u={id:uid(),code:nextCode('USR',db.users),createdAt:nowStamp(),isPrimary:false};db.users.push(u)}
 const oldUsername=u.username||'';
 u.name=name;u.username=username;u.recoveryCode=recoveryCode;
 if(pass)u.password=pass;
 if(u.isPrimary){u.role='admin';u.ownerId='';u.active=true}else{
  u.role=document.getElementById('usr_role')?.value||'observer';u.active=document.getElementById('usr_active')?.value!=='0';
  if(u.role==='owner'){
   const oid=document.getElementById('usr_owner_id')?.value||'';
   if(!oid||(rawDb.owners||[]).every(o=>String(o.id)!==String(oid))){flash('اختر المالك الذي سيرتبط بهذا الحساب');return}
   u.ownerId=oid;
  }else u.ownerId='';
 }
 if(String(currentUser.id)===String(u.id)){currentUser={...u};localStorage.setItem('aldagher_session_v1',String(u.id));applyRoleUI()}
 save();audit(id?'تعديل مستخدم':'إضافة مستخدم','إدارة المستخدمين',u.code,`${u.name} — ${roleLabel(u.role)}${oldUsername&&oldUsername!==u.username?' — تغيير اسم الدخول':''}`);renderUsers();flash(id?'تم تحديث المستخدم':'تمت إضافة المستخدم');
}
function deleteUser(id){
 if(!requireUserAdmin())return;ensureUsersData();const u=db.users.find(x=>String(x.id)===String(id));if(!u)return;
 if(u.isPrimary){flash('لا يمكن حذف الحساب الرئيسي');return}if(String(currentUser.id)===String(u.id)){flash('لا يمكن حذف المستخدم الذي تعمل به الآن');return}
 if(!confirm(`حذف المستخدم ${u.name}؟ سيبقى سجل عملياته محفوظًا.`))return;
 db.users=db.users.filter(x=>String(x.id)!==String(id));save();audit('حذف مستخدم','إدارة المستخدمين',u.code,u.name);renderUsers();flash('تم حذف المستخدم');
}
function permissionActionType(el){
 const js=String(el?.getAttribute?.('onclick')||'');
 const text=String(el?.textContent||el?.title||'').trim();
 const cls=String(el?.className||'');
 const hay=(js+' '+text+' '+cls).toLowerCase();
 if(/delete|remove|erase|trash|حذف|إزالة|الغاء السداد|إلغاء السداد/.test(hay))return 'delete';
 if(/saveuser|deleteuser|createuser|adduser|updateuser|edituser|toggleuser/.test(hay))return 'users';
 if(/\b(save|create|add|update|edit|restore|cancel|undo|approve|reject|pay|settle|record|post)\w*\s*\(/i.test(js) || /حفظ|إضافة|اضافة|تعديل|تسجيل|سداد|اعتماد|إلغاء|الغاء|استرجاع|إنشاء|انشاء|جديد/.test(text))return 'write';
 if(/openform\s*\(|render\w*form\s*\(/i.test(js))return 'write';
 return 'read';
}
function isObserverAllowedControl(el){

 const id=String(el.id||'').toLowerCase(), name=String(el.name||'').toLowerCase(), ph=String(el.placeholder||'');
 if(el.type==='search'||/search|filter|query/.test(id+' '+name)||/بحث|تصفية/.test(ph))return true;
 if(el.closest('.maintenance-filter-panel,.maintenance-invoice-filters,.filters,.filter-panel,.report-filters,.audit-filter,.audit-filters'))return true;
 return false;

function applyRoleUI(){
 const role=roleKey();
 document.body.dataset.userRole=role;
 const who=document.querySelector('.who');if(who){const ownerName=role==='owner'?(rawDb.owners||[]).find(o=>String(o.id)===String(currentUser.ownerId))?.name:'';who.textContent=`${currentUser?.name||''} — ${roleLabel(role)}${ownerName?' — '+ownerName:''}`;}
 document.querySelectorAll('.admin-only').forEach(el=>el.classList.toggle('permission-hidden',!canManageUsers()));
 applyPagePermissionControls();
}
function applyPagePermissionControls(){
 const role=roleKey();
 const root=document.getElementById('content');if(!root)return;
 root.querySelectorAll('[onclick]').forEach(el=>{
  const t=permissionActionType(el);
  let hide=false;
  if((role==='observer'||role==='owner')&&(t==='write'||t==='delete'||t==='users'))hide=true;
  if(role==='reviewer'&&(t==='delete'||t==='users'))hide=true;
  el.classList.toggle('permission-disabled',hide);
  if(hide)el.setAttribute('aria-hidden','true');else el.removeAttribute('aria-hidden');
 });
 root.querySelectorAll('input,select,textarea,[contenteditable="true"]').forEach(el=>{
  if((role==='observer'||role==='owner')&&!isObserverAllowedControl(el)){
   if(el.matches('[contenteditable]')){el.dataset.permissionOldContenteditable=el.getAttribute('contenteditable')||'true';el.setAttribute('contenteditable','false')}
   else {el.disabled=true;el.classList.add('observer-locked')}
  } else if(el.classList.contains('observer-locked')){
   el.disabled=false;el.classList.remove('observer-locked')
  }
 });
}
function enforcePermissionForElement(el,e){
 if(!el)return true;
 /* كل الأدوار لها حق فتح جميع القوائم والفروع والصفحات. المنع يخص العملية داخل الصفحة فقط. */
 if(el.closest?.('.sidebar'))return true;
 const role=roleKey(),type=permissionActionType(el);
 if(role==='reviewer'&&(type==='delete'||type==='users')){
  if(e){e.preventDefault();e.stopImmediatePropagation()}
  flash(type==='users'?'إدارة المستخدمين متاحة للمسؤول فقط':'الحذف متاح للمسؤول فقط');return false;
 }
 if((role==='observer'||role==='owner')&&(type==='write'||type==='delete'||type==='users')){
  if(e){e.preventDefault();e.stopImmediatePropagation()}
  flash(role==='owner'?'حساب المالك للعرض والمراجعة فقط':'حساب المراقب للعرض فقط');return false;
 }
 return true;
}
document.addEventListener('click',e=>{
 const el=e.target.closest('[onclick],button,a');if(!el)return;
 enforcePermissionForElement(el,e);
},true);
document.addEventListener('submit',e=>{
 if(roleKey()==='observer'||roleKey()==='owner'){
  const form=e.target;if(form&&form.closest('#content')){e.preventDefault();e.stopImmediatePropagation();flash(roleKey()==='owner'?'حساب المالك للعرض والمراجعة فقط':'حساب المراقب للعرض فقط')}
 }
},true);
document.addEventListener('beforeinput',e=>{
 if((roleKey()==='observer'||roleKey()==='owner')&&e.target?.closest?.('#content')&&!isObserverAllowedControl(e.target)){
  e.preventDefault();e.stopImmediatePropagation();
 }
},true);

/* حارس مركزي للعمليات: يمنع التنفيذ حتى لو تم استدعاء الدالة مباشرة من زر لم تُلتقط تسميته */
function installPermissionGuards(){
 const observerWrite=/^(save|delete|remove|create|add|update|edit|restore|cancel|undo|approve|reject|pay|settle|record|post|submit|toggle|mark)/i;
 const reviewerDelete=/^(delete|remove|erase)/i;
 Object.keys(window).forEach(name=>{
  if(name.startsWith('__permWrapped_'))return;
  let fn;try{fn=window[name]}catch(_){return}
  if(typeof fn!=='function'||fn.__permissionWrapped)return;
  const isUserMutation=/^(saveUser|deleteUser|createUser|addUser|updateUser|editUser|toggleUser|setUser)/i.test(name);
  const guardedObserver=observerWrite.test(name)||isUserMutation;
  const guardedReviewer=reviewerDelete.test(name)||isUserMutation;
  if(!guardedObserver&&!guardedReviewer)return;
  const wrapped=function(...args){
   const role=roleKey();
   if((role==='observer'||role==='owner')&&guardedObserver){flash(role==='owner'?'حساب المالك للعرض والمراجعة فقط':'حساب المراقب للعرض فقط');return false}
   if(role==='reviewer'&&guardedReviewer){flash(isUserMutation?'إدارة المستخدمين متاحة للمسؤول فقط':'الحذف متاح للمسؤول فقط');return false}
   return fn.apply(this,args);
  };
  wrapped.__permissionWrapped=true;wrapped.__permissionOriginal=fn;
  try{window[name]=wrapped}catch(_){}
 });
}
const __permissionObserver=new MutationObserver(()=>setTimeout(()=>{applyRoleUI();installPermissionGuards()},0));
document.addEventListener('DOMContentLoaded',()=>{
 const app=document.getElementById('app');if(app)__permissionObserver.observe(app,{childList:true,subtree:true});
 setTimeout(()=>{applyRoleUI();installPermissionGuards()},0);
});

function base64ToBytes(b64){
 const bin=atob(b64), out=new Uint8Array(bin.length);
 for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);
 return out;
}
function downloadImagesAsPDF(images,filename,imgW,imgH){
 const encoder=new TextEncoder(), parts=[], offsets=[], objs=[];
 const add=s=>parts.push(typeof s==='string'?encoder.encode(s):s);
 const totalLen=()=>parts.reduce((sum,p)=>sum+p.length,0);
 const pageW=842,pageH=595;
 const catalog=1,pagesObj=2;
 let objNum=3,pageRefs=[];

 images.forEach((b64,idx)=>{
   const imgObj=objNum++, contentObj=objNum++, pageObj=objNum++;
   pageRefs.push(pageObj);
   const img=base64ToBytes(b64);
   objs.push([
     imgObj,
     `<< /Type /XObject /Subtype /Image /Width ${imgW} /Height ${imgH} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${img.length} >>\nstream\n`,
     img,
     `\nendstream`
   ]);
   const stream=`q ${pageW} 0 0 ${pageH} 0 0 cm /Im${idx} Do Q`;
   objs.push([
     contentObj,
     `<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`
   ]);
   objs.push([
     pageObj,
     `<< /Type /Page /Parent ${pagesObj} 0 R /MediaBox [0 0 ${pageW} ${pageH}] /Resources << /XObject << /Im${idx} ${imgObj} 0 R >> >> /Contents ${contentObj} 0 R >>`
   ]);
 });

 objs.unshift([catalog,`<< /Type /Catalog /Pages ${pagesObj} 0 R >>`]);
 objs.splice(1,0,[pagesObj,`<< /Type /Pages /Kids [${pageRefs.map(n=>n+' 0 R').join(' ')}] /Count ${pageRefs.length} >>`]);

 add('%PDF-1.4\n');
 objs.sort((a,b)=>a[0]-b[0]);

 objs.forEach(o=>{
   offsets[o[0]]=totalLen();
   add(`${o[0]} 0 obj\n`);
   o.slice(1).forEach(add);
   add('\nendobj\n');
 });

 const xref=totalLen();
 add(`xref\n0 ${objNum}\n0000000000 65535 f \n`);
 for(let i=1;i<objNum;i++){
   add(String(offsets[i]||0).padStart(10,'0')+' 00000 n \n');
 }
 add(`trailer\n<< /Size ${objNum} /Root ${catalog} 0 R >>\nstartxref\n${xref}\n%%EOF`);

 const blob=new Blob(parts,{type:'application/pdf'});
 const a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download=filename;
 document.body.appendChild(a);
 a.click();
 a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

function readPropertyImage(input,key){

 const rd=new FileReader();rd.onload=()=>{pendingPropertyImages[key]=rd.result;const im=document.getElementById('preview_'+key);if(im){im.src=rd.result;im.style.display='block'}};rd.readAsDataURL(f);
}

function unitChargeAmount(u,typeKey,valueKey){
 const rent=Number(u.rent||0);
 const mode=u[typeKey]||'amount';
 const val=Number(u[valueKey]||0);
 return mode==='percent' ? rent*(val/100) : val;
}
function recalcPendingPropertyUnit(i){
 const u=pendingPropertyUnits[i];if(!u)return;
 const rent=Number(u.rent||0);
 const water=unitChargeAmount(u,'waterMode','water');
 const deposit=unitChargeAmount(u,'depositMode','deposit');
 const ownerFee=unitChargeAmount(u,'ownerShareMode','ownerShare');
 const tenantFee=unitChargeAmount(u,'tenantChargeMode','tenantCharge');
 const services=unitChargeAmount(u,'servicesMode','services');
 const discount=unitChargeAmount(u,'discountMode','discount');
 const beforeDiscount=rent+water+deposit+ownerFee+tenantFee+services;
 u.waterAmount=water;
 u.depositAmount=deposit;
 u.ownerShareAmount=ownerFee;
 u.tenantChargeAmount=tenantFee;
 u.servicesAmount=services;
 u.discountAmount=discount;
 u.net=beforeDiscount;
 u.totalAfter=Math.max(0,beforeDiscount-discount);
}
function updatePendingPropertyUnit(i,key,value,isNumber=false){
 pendingPropertyUnits[i][key]=isNumber?(Number(value)||0):value;
 recalcPendingPropertyUnit(i);
 const net=document.getElementById(`u_net_${i}`);
 const total=document.getElementById(`u_total_${i}`);
 if(net)net.value=Number(pendingPropertyUnits[i].net||0).toFixed(2);
 if(total)total.value=Number(pendingPropertyUnits[i].totalAfter||0).toFixed(2);
}

function makePropertyUnitCode(propertyCode,index){
 const base=String(propertyCode||'').trim()||generatePropertyCode();
 return `${base}-UN-${String(index+1).padStart(3,'0')}`;
}
function ensurePendingUnitCodes(){
 const propertyCode=document.getElementById('f_propertyCode')?.value||generatePropertyCode();
 pendingPropertyUnits.forEach((u,i)=>{
  if(!u.code)u.code=makePropertyUnitCode(propertyCode,i);
 });
}

function saveTenant(id=''){
 if(!Array.isArray(db.tenants))db.tenants=[];
 if(id && typeof requireManager==='function' && !requireManager())return;
 const name=document.getElementById('t_name')?.value.trim()||'';
 const mobile1=document.getElementById('t_mobile1')?.value.trim()||'';
 const nationalId=document.getElementById('t_nationalId')?.value.trim()||'';
 if(!name){flash('أدخل اسم المستأجر');return}
 if(!mobile1){flash('أدخل رقم الجوال');return}
 if(!nationalId){flash('أدخل رقم الهوية');return}
 const dup=(db.tenants||[]).find(t=>String(t.nationalId||'').trim()===nationalId && String(t.id)!==String(id));
 if(dup){flash('رقم الهوية مستخدم لمستأجر آخر');return}

 let t=id?(db.tenants||[]).find(x=>String(x.id)===String(id)):null;
 if(!t){
  t={id:uid(),code:generateTenantCode()};
  db.tenants.push(t);
 }
 Object.assign(t,{
  code:t.code||generateTenantCode(),
  name,
  mobile1,
  mobile2:document.getElementById('t_mobile2')?.value.trim()||'',
  nationality:document.getElementById('t_nationality')?.value.trim()||'',
  regionId:document.getElementById('t_region')?.value||'',
  cityId:document.getElementById('t_city')?.value||'',
  district:document.getElementById('t_district')?.value.trim()||'',
  address:document.getElementById('t_address')?.value.trim()||'',
  idType:document.getElementById('t_idType')?.value||'',
  nationalId,
  issuePlace:document.getElementById('t_issuePlace')?.value.trim()||'',
  idExpiry:document.getElementById('t_idExpiry')?.value||'',
  birthDate:document.getElementById('t_birthDate')?.value||'',
  email:document.getElementById('t_email')?.value.trim()||'',
  commercialRegister:document.getElementById('t_cr')?.value.trim()||'',
  vatNumber:document.getElementById('t_vat')?.value.trim()||'',
  representativeName:document.getElementById('t_repName')?.value.trim()||'',
  representativeMobile:document.getElementById('t_repMobile')?.value.trim()||'',
  representativeId:document.getElementById('t_repId')?.value.trim()||'',
  details:document.getElementById('t_details')?.value.trim()||'',
  residencyImage:tenantImages.residencyImage||'',
  tenantFile:tenantImages.tenantFile||''
 });
 if(save()===false)return;
 if(typeof audit==='function')audit(id?'تعديل مستأجر':'إضافة مستأجر','إدارة المستأجرين',t.code);
 flash(id?'تم حفظ تعديل المستأجر':'تمت إضافة المستأجر بنجاح');
 renderTenants();
}

let standaloneUnitDraft=null;

function getPropertyByIdForUnit(id){
 return (db.properties||[]).find(p=>String(p.id)===String(id));
}
function nextUnitIndexForProperty(propertyId){
 const related=(db.units||[]).filter(u=>String(u.propertyId)===String(propertyId));
 let max=0;
 related.forEach(u=>{
  const m=String(u.code||'').match(/-UN-(\d+)$/i);
  if(m)max=Math.max(max,Number(m[1])||0);
  else if(Number.isFinite(Number(u.propertyUnitIndex)))max=Math.max(max,Number(u.propertyUnitIndex)+1);
 });
 return max;
}
function standaloneUnitCode(propertyId){
 const p=getPropertyByIdForUnit(propertyId);
 if(!p)return '';
 return makePropertyUnitCode(p.code,nextUnitIndexForProperty(propertyId));
}
function standaloneUnitCalcAmount(mode,value,rent){
 const v=Number(value||0);
 return mode==='percent' ? Number(rent||0)*(v/100) : v;
}
function recalcStandaloneUnit(){
 const d=standaloneUnitDraft;if(!d)return;
 const rent=Number(d.rent||0);
 d.waterAmount=standaloneUnitCalcAmount(d.waterMode,d.water,rent);
 d.depositAmount=standaloneUnitCalcAmount(d.depositMode,d.deposit,rent);
 d.ownerShareAmount=standaloneUnitCalcAmount(d.ownerShareMode,d.ownerShare,rent);
 d.tenantChargeAmount=standaloneUnitCalcAmount(d.tenantChargeMode,d.tenantCharge,rent);
 d.servicesAmount=standaloneUnitCalcAmount(d.servicesMode,d.services,rent);
 d.discountAmount=standaloneUnitCalcAmount(d.discountMode,d.discount,rent);
 d.net=rent+d.waterAmount+d.depositAmount+d.ownerShareAmount+d.tenantChargeAmount+d.servicesAmount;
 d.totalAfter=Math.max(0,d.net-d.discountAmount);
 const a=document.getElementById('su_net'),b=document.getElementById('su_total');
 if(a)a.value=Number(d.net||0).toFixed(2);
 if(b)b.value=Number(d.totalAfter||0).toFixed(2);
}
function updateStandaloneUnit(key,value,isNumber=false){
 if(!standaloneUnitDraft)return;
 standaloneUnitDraft[key]=isNumber?(Number(value)||0):value;
 if(key==='propertyId'){
  standaloneUnitDraft.code=standaloneUnitCode(value);
  const c=document.getElementById('su_code');if(c)c.value=standaloneUnitDraft.code||'';
 }
 recalcStandaloneUnit();
}

function saveStandaloneUnit(editId=''){
 const d=standaloneUnitDraft;if(!d)return;
 if(editId && typeof requireManager==='function' && !requireManager())return;
 if(!d.propertyId){flash('اختر العقار أولًا');return}
 if(!d.type){flash('اختر نوع الوحدة');return}
 const p=getPropertyByIdForUnit(d.propertyId);
 if(!p){flash('العقار المحدد غير موجود');return}
 recalcStandaloneUnit();

 let u=editId?(db.units||[]).find(x=>String(x.id)===String(editId)):null;
 if(!u){
  u={id:uid(),propertyId:d.propertyId,code:d.code||standaloneUnitCode(d.propertyId),generatedFromProperty:false};
  db.units.push(u);
 }else{
  u.propertyId=d.propertyId;
  if(!u.code || String(u.propertyId)!==String(d.propertyId))u.code=d.code||standaloneUnitCode(d.propertyId);
 }
 Object.assign(u,{
  propertyId:d.propertyId,
  code:u.code||d.code||standaloneUnitCode(d.propertyId),
  type:d.type||'',description:d.description||'',purpose:d.purpose||'',
  rooms:Number(d.rooms||0),area:Number(d.area||0),electricMeter:d.electricMeter||'',
  rent:Number(d.rent||0),
  waterMode:d.waterMode||'amount',water:Number(d.water||0),waterAmount:Number(d.waterAmount||0),
  depositMode:d.depositMode||'amount',deposit:Number(d.deposit||0),depositAmount:Number(d.depositAmount||0),
  ownerShareMode:d.ownerShareMode||'amount',ownerShare:Number(d.ownerShare||0),ownerShareAmount:Number(d.ownerShareAmount||0),
  tenantChargeMode:d.tenantChargeMode||'amount',tenantCharge:Number(d.tenantCharge||0),tenantChargeAmount:Number(d.tenantChargeAmount||0),
  servicesMode:d.servicesMode||'amount',services:Number(d.services||0),servicesAmount:Number(d.servicesAmount||0),
  discountMode:d.discountMode||'amount',discount:Number(d.discount||0),discountAmount:Number(d.discountAmount||0),
  net:Number(d.net||0),totalAfter:Number(d.totalAfter||0),
  status:u.status||'شاغرة'
 });
 saveDB();
 if(typeof audit==='function')audit(editId?'تعديل وحدة':'إضافة وحدة',u.code||u.id);
 flash(editId?'تم حفظ تعديل الوحدة':'تمت إضافة الوحدة بنجاح');
 showPage('units');

function contractHasSettlement(c){
 return Array.isArray(db.tenantSettlements) && db.tenantSettlements.some(s=>String(s.contractId)===String(c?.id));
}
function contractSettlementRecord(c){
 return (db.tenantSettlements||[]).filter(s=>String(s.contractId)===String(c?.id)).sort((a,b)=>String(b.createdAt||'').localeCompare(String(a.createdAt||'')))[0]||null;
}
function contractState(c){
 if(!c)return '—';
 if(contractHasSettlement(c))return 'تمت التسوية';
 const td=today();
 if(c.startDate && c.startDate>td)return 'قادم';
 if(c.endDate && c.endDate<td)return 'منتهي';
 if(c.status==='ملغي')return 'ملغي';
 return 'ساري';
}
function activeRentContracts(){
 return (db.contracts||[]).filter(c=>!contractHasSettlement(c) && contractState(c)==='ساري');
}
function expiredRentContracts(){
 return (db.contracts||[]).filter(c=>!contractHasSettlement(c) && contractState(c)==='منتهي');
}
function settledRentContracts(){
 return (db.contracts||[]).filter(c=>contractHasSettlement(c));
}

function daysUntilDate(iso){
 if(!iso)return null;
 const a=new Date(today()+'T00:00:00'),b=new Date(iso+'T00:00:00');
 if(Number.isNaN(b.getTime()))return null;
 return Math.ceil((b-a)/86400000);
}
function evictionStatusLabel(r){
 if(r.status==='vacated')return 'تم الإخلاء';
 if(r.status==='cancelled')return 'ملغي';
 const d=daysUntilDate(r.vacateDate);
 if(d===null)return 'مفتوح';
 if(d<0)return 'متأخر عن موعد الإخلاء';
 if(d===0)return 'الإخلاء اليوم';
 return 'طلب إخلاء مفتوح';
}
function evictionDaysHTML(r){
 if(r.status==='vacated')return '<span class="pay-status paid">تم الإخلاء</span>';
 if(r.status==='cancelled')return '<span class="pay-status">ملغي</span>';
 const d=daysUntilDate(r.vacateDate);
 if(d===null)return '—';
 if(d<0)return `<span class="eviction-days overdue">متأخر ${Math.abs(d)} يوم</span>`;
 if(d===0)return `<span class="eviction-days overdue">اليوم</span>`;
 return `<span class="eviction-days ${d<=30?'soon':''}">متبقي ${d} يوم</span>`;
}

 if(!data.vacateDate){flash('حدد تاريخ الإخلاء المتوقع');return}
 if(data.requestDate && data.vacateDate<data.requestDate){flash('تاريخ الإخلاء لا يمكن أن يسبق تاريخ الطلب');return}

 if(!r){r={id:uid(),code:nextCode('EVQ',getEvictionRequests()),createdAt:nowStamp(),createdBy:currentUser.username};getEvictionRequests().push(r)}
 Object.assign(r,data,{updatedAt:nowStamp()});
 save();audit(editing?'تعديل طلب إخلاء':'إضافة طلب إخلاء','إدارة الإيجارات والعقود',r.code,getTenant(r.tenantId)?.name||'');

function safeDateISO(d){
 if(!(d instanceof Date)||Number.isNaN(d.getTime()))return '';
 return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function addContractPeriod(start,value,unit,subtractDay=true){
 if(!start||!value)return '';
 const d=new Date(start+'T00:00:00'); if(Number.isNaN(d.getTime()))return '';
 value=Number(value||0);
 if(unit==='day')d.setDate(d.getDate()+value);
 else if(unit==='week')d.setDate(d.getDate()+value*7);
 else if(unit==='month')d.setMonth(d.getMonth()+value);
 else if(unit==='year')d.setFullYear(d.getFullYear()+value);
 if(subtractDay)d.setDate(d.getDate()-1);
 return safeDateISO(d);
}
function gregorianToHijri(iso){
 if(!iso)return '';
 const d=new Date(iso+'T12:00:00'); if(Number.isNaN(d.getTime()))return '';
 try{
  const parts=new Intl.DateTimeFormat('en-US-u-ca-islamic-umalqura',{year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d);
  const v={};parts.forEach(p=>{if(['year','month','day'].includes(p.type))v[p.type]=p.value});
  return `${v.year}-${String(v.month).padStart(2,'0')}-${String(v.day).padStart(2,'0')}`;
 }catch(e){return ''}
}
function hijriToGregorian(h){
 const m=String(h||'').trim().match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})$/); if(!m)return '';
 const hy=Number(m[1]),hm=Number(m[2]),hd=Number(m[3]);
 if(hm<1||hm>12||hd<1||hd>30)return '';
 const approxYear=hy+579;
 const base=new Date(approxYear,6,1,12,0,0);
 for(let off=-450;off<=450;off++){
  const d=new Date(base);d.setDate(d.getDate()+off);
  const iso=safeDateISO(d);
  if(gregorianToHijri(iso)===`${hy}-${String(hm).padStart(2,'0')}-${String(hd).padStart(2,'0')}`)return iso;
 }
 return '';
}

function periodNextDate(iso,n,unit){

 if(unit==='day')d.setDate(d.getDate()+n);
 if(unit==='week')d.setDate(d.getDate()+7*n);

function contractSchedulePreview(){

 const requested=Math.max(1,Math.floor(Number(d.installmentCount||1)));
 const every=Math.max(1,Math.floor(Number(d.payEveryValue||1)));
 const unit=d.payEveryUnit||'month';
 if(!start||!end||end<start)return [];
 let dates=[];
 for(let i=0;i<requested;i++){
  const due=periodNextDate(start,i*every,unit);
  if(!due||due>end)break;
  dates.push(due);
 }
 if(!dates.length)dates=[start];
 const f=contractFinancials(), amount=f.tenantTotal/dates.length;

}
