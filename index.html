<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=yes">
<meta name="theme-color" content="#151b24">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="الداغر للعقارات">
<title>الداغر للعقارات</title>
<style>
:root{
 --bg:#f5f6f8;--card:#fff;--ink:#1d2433;--muted:#7d8795;--line:#e8ebef;
 --side:#151b24;--gold:#b78a45;--gold-soft:#f6efe4;--green:#208a5a;
 --red:#bd514b;--shadow:0 10px 30px rgba(20,28,38,.055)
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Tahoma,Arial;color:var(--ink)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#131a23,#242f3d);padding:20px}
.loginbox{width:min(430px,100%);background:#fff;padding:32px;border-radius:22px;box-shadow:0 24px 70px #0006}
.mark{width:64px;height:64px;border:1px solid #c7a267;border-radius:16px;margin:auto;display:grid;place-items:center;color:#b78a45;font-size:26px;font-weight:700}
.loginbox h2{text-align:center;margin:14px 0 5px}.loginbox p{text-align:center;color:var(--muted);font-size:12px}
.loginbox label{display:block;font-size:12px;color:#667085;margin:10px 0 6px}
.loginbox input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px}
.loginbox button{width:100%;border:0;background:#b78a45;color:#fff;padding:12px;border-radius:10px;margin-top:16px;font-weight:700}
.err{background:#fff0f0;color:#a22;padding:10px;border-radius:9px;font-size:12px;margin-top:10px}
.sidebar{position:fixed;right:0;top:0;bottom:0;width:270px;background:linear-gradient(180deg,var(--side),#101720);color:#fff;padding:18px 14px;overflow:auto}
.brand{padding:10px;border-bottom:1px solid #ffffff14;margin-bottom:12px}
.brand h2{margin:0;font-size:19px}.brand small{color:#9da8b5;font-size:11px}
.nav button{display:block;width:100%;border:0;background:transparent;color:#cdd5df;padding:11px 12px;border-radius:10px;text-align:right;margin:2px 0}
.nav button:hover,.nav button.active{background:#ffffff0d;color:#fff}
.nav button.active{box-shadow:inset -3px 0 0 #c69b59;background:#b78a451d}
.group .sub{display:none;padding-right:14px;border-right:1px solid #ffffff1a;margin-right:8px}
.group.open .sub{display:block}.sub button{font-size:11px;padding:8px 10px}
.main{margin-right:270px;min-height:100vh}
.top{height:74px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;position:sticky;top:0;z-index:5}
.top h2{margin:0;font-size:18px}.who{margin-right:auto;color:var(--muted);font-size:12px}
.wrap{padding:24px}
.hero,.card,.panel{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.hero{padding:22px;margin-bottom:16px}.hero h1{margin:0 0 6px;font-size:24px}
.muted{color:var(--muted);font-size:12px}
.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.card{padding:16px}.card .k{color:var(--muted);font-size:11px}.card .v{font-size:22px;font-weight:700;margin-top:8px}
.card.click{cursor:pointer;transition:.15s}.card.click:hover{transform:translateY(-2px)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.panel{padding:17px}.panel h3{margin:0 0 13px;font-size:15px}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.toolbar h1{margin:0 0 5px;font-size:23px}
.btn{border:0;background:#1d2632;color:#fff;padding:9px 13px;border-radius:9px}.btn.gold{background:var(--gold)}.btn.soft{background:#f1f3f5;color:#35404c}.btn.danger{background:#b64a46}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:10px 9px;border-bottom:1px solid #eef0f2;text-align:right;white-space:nowrap}th{background:#fafafa;color:#77818e}
.clickrow{cursor:pointer}.clickrow:hover{background:#fbfaf7}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:10px;background:#eef2f7}.good{background:#eaf7f0;color:var(--green)}.bad{background:#fff0ee;color:var(--red)}.warn{background:#fff5df;color:#946a17}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field label{display:block;font-size:11px;color:#697381;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff}.field textarea{min-height:80px}.full{grid-column:1/-1}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:15px;z-index:30}.modal.show{display:flex}.modalbox{width:min(760px,96%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:20px}
.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.close{border:0;background:#f1f3f5;width:34px;height:34px;border-radius:9px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.quick .q{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;cursor:pointer}.quick .q:hover{border-color:#d4bd97}
.flash{position:fixed;left:20px;bottom:20px;background:#1d2632;color:#fff;padding:12px 16px;border-radius:10px;z-index:50;box-shadow:0 10px 30px #0003}
@media(max-width:1100px){.cards{grid-template-columns:repeat(3,1fr)}}@media(max-width:850px){.sidebar{position:static;width:100%}.main{margin:0}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}@media(max-width:550px){.formgrid,.quick{grid-template-columns:1fr}.full{grid-column:auto}}

/* Full interface map reproduced from the supplied video */
.video-cards{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.video-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 14px;min-height:145px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;box-shadow:var(--shadow);transition:.15s}
.video-card:hover{transform:translateY(-2px);border-color:#dcc8a9}
.video-card .ico{width:58px;height:58px;border-radius:16px;background:var(--gold-soft);display:grid;place-items:center;font-size:28px;margin-bottom:11px}
.video-card b{font-size:13px}
.reminders{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.reminders-head{background:#1d2632;color:#fff;padding:11px 14px;font-weight:700;font-size:13px}
.reminders-grid{display:grid;grid-template-columns:repeat(2,1fr)}
.reminder{padding:13px 14px;border:1px solid #fff3;cursor:pointer;font-size:12px;display:flex;justify-content:space-between;gap:10px}
.reminder.red{background:#b93430;color:#fff}.reminder.amber{background:#d79a16;color:#fff}
.reminder.full{grid-column:1/-1}
.module-page .module-title{display:flex;align-items:center;gap:12px}
.module-page .module-icon{width:50px;height:50px;border-radius:14px;background:var(--gold-soft);display:grid;place-items:center;font-size:24px}
.module-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:16px}
.module-item{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px;cursor:pointer;transition:.15s}
.module-item:hover{border-color:#d5bb91;transform:translateY(-1px)}
.module-item b{display:block;margin-bottom:4px;font-size:12px}.module-item small{color:var(--muted)}
.nav-sep{height:1px;background:#ffffff12;margin:8px 5px}
@media(max-width:1150px){.video-cards{grid-template-columns:repeat(3,1fr)}}
@media(max-width:720px){.video-cards,.module-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:470px){.video-cards,.module-grid,.reminders-grid{grid-template-columns:1fr}.reminder.full{grid-column:auto}}


/* Professional unified line-icon system — visual change only */
.icon-svg{width:22px;height:22px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.video-card .ico{color:var(--gold);font-size:0}
.video-card .ico .icon-svg{width:30px;height:30px}
.module-icon{color:var(--gold);font-size:0!important}
.module-icon .icon-svg{width:26px;height:26px}
.nav .navico{width:25px;height:25px;border-radius:8px;background:#ffffff0a;display:inline-grid;place-items:center;margin-left:7px;color:#c9a66b;vertical-align:middle}
.nav .navico .icon-svg{width:16px;height:16px}


/* User operations log — scoped styles */
.audit-shell{display:grid;gap:14px}
.audit-filter,.audit-tablebox{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px}
.audit-filter-grid{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end}
.audit-actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.audit-actions .mini{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 10px;cursor:pointer;font:inherit}
.audit-actions .mini:hover{border-color:#cdb58d}
.audit-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.audit-search{display:flex;align-items:center;gap:7px}
.audit-search input{width:230px}
.audit-avatar{width:30px;height:30px;border-radius:50%;background:var(--gold-soft);color:var(--gold);display:inline-grid;place-items:center;font-weight:800;border:1px solid #e5d2b2}
.audit-op{max-width:650px;line-height:1.7}
.audit-code{font-family:monospace;direction:ltr;display:inline-block}
.audit-empty{text-align:center;padding:35px;color:var(--muted)}
.audit-pages{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:12px;flex-wrap:wrap}
.audit-pagebtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer}
.audit-pagebtn.active{background:#1d2632;color:#fff}
.col-menu{position:relative}
.col-pop{position:absolute;z-index:20;top:42px;left:0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;box-shadow:0 12px 30px #0002;min-width:190px;display:none}
.col-pop.show{display:block}.col-pop label{display:block;padding:5px;white-space:nowrap}
@media(max-width:700px){.audit-filter-grid{grid-template-columns:1fr}.audit-search input{width:160px}}
@media print{aside,.top,.audit-filter,.audit-actions,.audit-search,.audit-pages{display:none!important}.main{margin:0!important}.wrap{padding:0!important}.audit-tablebox{box-shadow:none;border:0}}


.audit-actions .iconbtn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 11px;cursor:pointer;font:inherit;font-weight:700}
.audit-actions .iconbtn:hover{border-color:#cdb58d;box-shadow:0 4px 14px #0000000d}
.audit-actions .iconbtn svg{width:18px;height:18px}
.audit-actions .pdfbtn{color:#b42318}
.audit-actions .excelbtn{color:#16834b}
.audit-actions .printbtn{color:#334155}


.program-data-page{max-width:1100px;margin:auto}
.program-data-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 8px 24px rgba(17,24,39,.05)}
.program-data-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.program-data-grid .full{grid-column:1/-1}
.program-data-card .field label{display:block;margin-bottom:7px;font-weight:700;color:#374151}
.program-data-card input,.program-data-card textarea{width:100%;border:1px solid #dfe3e8;border-radius:12px;padding:11px 12px;font:inherit;background:#fff}
.program-data-card textarea{min-height:88px;resize:vertical}
.logo-uploader{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:16px;border:1px dashed #d8c6a7;border-radius:16px;background:#fffaf3}
.logo-preview{width:110px;height:110px;border-radius:18px;border:1px solid #e3e6eb;background:#fff;display:grid;place-items:center;overflow:hidden}
.logo-preview img{max-width:94%;max-height:94%;object-fit:contain}
.logo-placeholder{font-weight:800;color:#9a7b49;font-size:28px}
.program-data-actions{display:flex;gap:10px;justify-content:flex-start;margin-top:18px}
.print-preview{margin-top:20px;border:1px solid #e6e8ec;border-radius:18px;padding:18px;background:#f8fafc}
.print-preview-title{font-weight:800;margin-bottom:10px;color:#4b5563}
.printhead-preview{background:#fff;border:1px solid #e6dccb;border-radius:16px;padding:16px;display:flex;direction:ltr;justify-content:space-between;gap:22px;align-items:center}
.printhead-preview .ph-brand,.printhead-preview .ph-info{direction:rtl}
.printhead-preview .ph-brand{display:flex;align-items:center;gap:12px}
.printhead-preview .ph-logo{width:68px;height:68px;border-radius:14px;border:1px solid #e5e7eb;display:grid;place-items:center;overflow:hidden;background:#fff}
.printhead-preview .ph-logo img{max-width:100%;max-height:100%;object-fit:contain}
.printhead-preview .ph-office{font-size:20px;font-weight:800;color:#172033}
.printhead-preview .ph-info{font-size:12px;line-height:1.85;color:#4b5563;text-align:right;max-width:58%}
@media(max-width:760px){.program-data-grid{grid-template-columns:1fr}.printhead-preview{flex-direction:column;direction:rtl;align-items:stretch}.printhead-preview .ph-info{max-width:none}.program-data-grid .full{grid-column:auto}}


.settings-page{max-width:1180px;margin:auto}

.settings-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}

.bank-page{max-width:1180px;margin:auto}

.global-page-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 14px}

.maintenance-types-page{max-width:1050px;margin:auto}

/* ===== Appearance Templates: visual-only layer ===== */
:root{
 --theme-bg:#f3f5f7;
 --theme-surface:#ffffff;
 --theme-surface-2:#f8fafc;
 --theme-text:#172033;
 --theme-muted:#7a8493;
 --theme-border:#e5e8ec;
 --theme-sidebar:#202936;
 --theme-sidebar-text:#eef2f5;
 --theme-sidebar-muted:#aeb7c2;
 --theme-accent:#b79255;
 --theme-accent-soft:#fff7e9;
 --theme-topbar:#ffffff;
 --theme-card-radius:20px;
 --theme-shadow:0 8px 24px rgba(17,24,39,.06);
}
body{background:var(--theme-bg)!important;color:var(--theme-text)!important}
.content,.main,.page,.workspace{background:var(--theme-bg)!important;color:var(--theme-text)!important}
.sidebar{background:var(--theme-sidebar)!important;color:var(--theme-sidebar-text)!important}
.sidebar *{color:inherit}
.sidebar .muted,.sidebar small{color:var(--theme-sidebar-muted)!important}
.topbar{background:var(--theme-topbar)!important;border-color:var(--theme-border)!important}
.card,.stat,.program-data-card,.notification-card,.contract-settings-card,.unit-types-card,.maintenance-types-card,.property-types-card{
 background:var(--theme-surface)!important;border-color:var(--theme-border)!important;border-radius:var(--theme-card-radius)!important;box-shadow:var(--theme-shadow)!important
}
input,select,textarea{background:var(--theme-surface)!important;color:var(--theme-text)!important;border-color:var(--theme-border)!important}
table td{color:var(--theme-text)}
.muted{color:var(--theme-muted)!important}
.btn.gold{background:var(--theme-accent)!important}
.badge,.soft,.btn.soft{border-color:var(--theme-border)!important}
.hero,.dashboard-hero{border-color:var(--theme-border)!important}

/* Modern - current spirit */
body.theme-modern{
 --theme-bg:#f3f5f7;--theme-surface:#fff;--theme-surface-2:#f8fafc;--theme-text:#172033;
 --theme-muted:#7a8493;--theme-border:#e5e8ec;--theme-sidebar:#202936;--theme-sidebar-text:#eef2f5;
 --theme-sidebar-muted:#aeb7c2;--theme-accent:#b79255;--theme-accent-soft:#fff7e9;--theme-topbar:#fff;
 --theme-card-radius:20px;--theme-shadow:0 8px 24px rgba(17,24,39,.06)
}

/* Classic */
body.theme-classic{
 --theme-bg:#f2eee6;--theme-surface:#fffdf8;--theme-surface-2:#f7f1e7;--theme-text:#2b241c;
 --theme-muted:#7d7060;--theme-border:#d9cbb7;--theme-sidebar:#3b3025;--theme-sidebar-text:#fff8ed;
 --theme-sidebar-muted:#cdbda8;--theme-accent:#9b7441;--theme-accent-soft:#f5e9d5;--theme-topbar:#fffaf0;
 --theme-card-radius:8px;--theme-shadow:0 6px 16px rgba(63,48,34,.08)
}
body.theme-classic .card,body.theme-classic .stat{border-width:1px}
body.theme-classic h1,body.theme-classic h2,body.theme-classic h3{letter-spacing:.1px}

/* Light */
body.theme-light{
 --theme-bg:#fff;--theme-surface:#fff;--theme-surface-2:#fbfbfb;--theme-text:#111827;
 --theme-muted:#667085;--theme-border:#e5e7eb;--theme-sidebar:#fff;--theme-sidebar-text:#111827;
 --theme-sidebar-muted:#667085;--theme-accent:#b79255;--theme-accent-soft:#fff7e9;--theme-topbar:#fff;
 --theme-card-radius:16px;--theme-shadow:0 3px 12px rgba(17,24,39,.04)
}
body.theme-light .sidebar{border-left:1px solid var(--theme-border)!important}
body.theme-light .sidebar a,body.theme-light .sidebar button{color:#111827!important}
body.theme-light .sidebar .active{background:#f4f4f5!important}

/* Dark */
body.theme-dark{
 --theme-bg:#0e1116;--theme-surface:#151a21;--theme-surface-2:#1b212a;--theme-text:#f5f7fa;
 --theme-muted:#aab3bf;--theme-border:#2a323d;--theme-sidebar:#090c10;--theme-sidebar-text:#f8fafc;
 --theme-sidebar-muted:#9ca7b5;--theme-accent:#b79255;--theme-accent-soft:#2b251b;--theme-topbar:#151a21;
 --theme-card-radius:18px;--theme-shadow:0 10px 28px rgba(0,0,0,.25)
}
body.theme-dark table th{background:#090c10!important;color:#fff!important}
body.theme-dark table tbody tr:nth-child(even){background:#171d25!important}
body.theme-dark .notification-note,body.theme-dark .unit-type-addbox,body.theme-dark .maintenance-type-addbox{background:#1b212a!important;border-color:#343e4a!important}
body.theme-dark .btn.soft,body.theme-dark .soft{background:#202731!important;color:#f5f7fa!important}
body.theme-dark .loginbox{background:#151a21!important;color:#f5f7fa!important}

/* Colorful */
body.theme-colorful{
 --theme-bg:#f7f8fb;--theme-surface:#fff;--theme-surface-2:#fbfcfe;--theme-text:#202738;
 --theme-muted:#788296;--theme-border:#e7eaf0;--theme-sidebar:#202738;--theme-sidebar-text:#f8fafc;
 --theme-sidebar-muted:#b7c0cf;--theme-accent:#d97745;--theme-accent-soft:#fff4ed;--theme-topbar:#fff;
 --theme-card-radius:22px;--theme-shadow:0 10px 26px rgba(32,39,56,.07)
}
body.theme-colorful .dashboard-grid .card:nth-child(5n+1) .icon,
body.theme-colorful .cards .card:nth-child(5n+1) .icon{background:#fff1ec!important;color:#d6603c!important}
body.theme-colorful .dashboard-grid .card:nth-child(5n+2) .icon,
body.theme-colorful .cards .card:nth-child(5n+2) .icon{background:#eef5ff!important;color:#4779d4!important}
body.theme-colorful .dashboard-grid .card:nth-child(5n+3) .icon,
body.theme-colorful .cards .card:nth-child(5n+3) .icon{background:#fff5df!important;color:#d89628!important}
body.theme-colorful .dashboard-grid .card:nth-child(5n+4) .icon,
body.theme-colorful .cards .card:nth-child(5n+4) .icon{background:#eef8f2!important;color:#3f8a61!important}
body.theme-colorful .dashboard-grid .card:nth-child(5n+5) .icon,
body.theme-colorful .cards .card:nth-child(5n+5) .icon{background:#f5efff!important;color:#8058c7!important}

/* Template settings */
.template-settings-page{max-width:1180px;margin:auto}
.template-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.template-card{background:var(--theme-surface);border:1px solid var(--theme-border);border-radius:20px;padding:16px;box-shadow:var(--theme-shadow);cursor:pointer;transition:.18s;position:relative}
.template-card:hover{transform:translateY(-2px)}
.template-card.selected{outline:2px solid var(--theme-accent);outline-offset:2px}
.template-preview{height:170px;border:1px solid var(--theme-border);border-radius:14px;overflow:hidden;display:grid;grid-template-columns:30% 70%;direction:ltr}
.template-preview .pv-side{padding:12px}
.template-preview .pv-main{padding:12px;display:grid;grid-template-rows:26px 1fr;gap:10px}
.template-preview .pv-bar{border-radius:8px}
.template-preview .pv-cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.template-preview .pv-box{border-radius:10px;border:1px solid rgba(0,0,0,.08)}
.template-name{font-size:16px;font-weight:900;margin-top:12px}
.template-desc{font-size:12px;color:var(--theme-muted);line-height:1.8;margin-top:4px}
.template-check{position:absolute;top:12px;left:12px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--theme-accent);color:#fff;font-weight:900;opacity:0}
.template-card.selected .template-check{opacity:1}
@media(max-width:850px){.template-grid{grid-template-columns:1fr}}


/* ===== Theme runtime fix: apply to the entire application ===== */
body[class*="theme-"]{
 --bg:var(--theme-bg)!important;
 --ink:var(--theme-text)!important;
 --muted:var(--theme-muted)!important;
 --line:var(--theme-border)!important;
 --side:var(--theme-sidebar)!important;
 --gold:var(--theme-accent)!important;
 --gold-soft:var(--theme-accent-soft)!important;
 --shadow:var(--theme-shadow)!important;
}

/* Main shell */
body[class*="theme-"] .main,
body[class*="theme-"] .content,
body[class*="theme-"] #content{background:var(--theme-bg)!important;color:var(--theme-text)!important}
body[class*="theme-"] .top{background:var(--theme-topbar)!important;border-color:var(--theme-border)!important;color:var(--theme-text)!important}
body[class*="theme-"] .sidebar{background:var(--theme-sidebar)!important;color:var(--theme-sidebar-text)!important}
body[class*="theme-"] .sidebar .brand,
body[class*="theme-"] .sidebar .nav,
body[class*="theme-"] .sidebar .nav button{color:var(--theme-sidebar-text)!important}
body[class*="theme-"] .sidebar .nav button:hover,
body[class*="theme-"] .sidebar .nav button.active{background:color-mix(in srgb,var(--theme-accent) 18%,transparent)!important;color:var(--theme-sidebar-text)!important}
body[class*="theme-"] .sidebar .nav button.active{box-shadow:inset -3px 0 0 var(--theme-accent)!important}
body[class*="theme-"] .nav-sep{background:color-mix(in srgb,var(--theme-sidebar-text) 12%,transparent)!important}

/* All cards/panels/pages */
body[class*="theme-"] .hero,
body[class*="theme-"] .card,
body[class*="theme-"] .panel,
body[class*="theme-"] .video-card,
body[class*="theme-"] .module-item,
body[class*="theme-"] .reminders,
body[class*="theme-"] .audit-filter,
body[class*="theme-"] .audit-tablebox,
body[class*="theme-"] .settings-card,
body[class*="theme-"] .bank-card,
body[class*="theme-"] .program-data-card,
body[class*="theme-"] .property-types-card,
body[class*="theme-"] .unit-types-card,
body[class*="theme-"] .maintenance-types-card,
body[class*="theme-"] .notification-card,
body[class*="theme-"] .contract-settings-card,
body[class*="theme-"] .template-card,
body[class*="theme-"] .reminder-summary .sum,
body[class*="theme-"] .quick .q{
 background:var(--theme-surface)!important;

/* Forms and controls */

body[class*="theme-"] .audit-actions .iconbtn,

}
body[class*="theme-"] .field label,
body[class*="theme-"] th,

/* Tables */

 color:var(--theme-text)!important;
 border-color:var(--theme-border)!important;
 border-radius:var(--theme-card-radius)!important;
 box-shadow:var(--theme-shadow)!important;
 transition:.18s ease!important;
}
body[class*="theme-"] .dashboard-grid > *:hover,
body[class*="theme-"] .cards > *:hover,
body[class*="theme-"] .video-card:hover,
body[class*="theme-"] .module-card:hover{
 transform:translateY(-2px);
}

/* الأيقونات الرئيسية */
body[class*="theme-"] .ico,
body[class*="theme-"] .icon,
body[class*="theme-"] .module-icon,
body[class*="theme-"] .card-icon,
body[class*="theme-"] .dash-icon{
 background:var(--theme-accent-soft)!important;
 color:var(--theme-accent)!important;
 border-color:color-mix(in srgb,var(--theme-accent) 22%,var(--theme-border))!important;
}

/* صفحات التفاصيل، النماذج، الجداول، المستندات داخل البرنامج */
body[class*="theme-"] .formbox,
body[class*="theme-"] .form-card,
body[class*="theme-"] .detail-card,
body[class*="theme-"] .document-card,
body[class*="theme-"] .report-card,
body[class*="theme-"] .tablebox,
body[class*="theme-"] .table-wrap,
body[class*="theme-"] .sheet,
body[class*="theme-"] .box,
body[class*="theme-"] .section{
 background:var(--theme-surface)!important;
 color:var(--theme-text)!important;
 border-color:var(--theme-border)!important;
 box-shadow:var(--theme-shadow)!important;
}

/* تصميم العصر */
body.theme-asr{
 --theme-bg:#f4f6fa;
 --theme-surface:#ffffff;
 --theme-surface-2:#f8fafc;
 --theme-text:#17233c;
 --theme-muted:#718096;
 --theme-border:#dfe5ee;
 --theme-sidebar:#13213a;
 --theme-sidebar-text:#f8fbff;
 --theme-sidebar-muted:#b8c4d6;
 --theme-accent:#e1683f;
 --theme-accent-soft:#fff1eb;
 --theme-topbar:#ffffff;
 --theme-card-radius:18px;
 --theme-shadow:0 10px 24px rgba(25,42,70,.08);
}

/* شريط علوي لوني هادئ */
body.theme-asr .top,
body.theme-asr .topbar{
 position:relative;
 border-bottom:0!important;
 box-shadow:0 4px 14px rgba(25,42,70,.06)!important;
}
body.theme-asr .top::after,
body.theme-asr .topbar::after{
 content:"";
 position:absolute;
 right:0;left:0;bottom:0;
 height:4px;
 background:linear-gradient(90deg,#d9534f 0 32%,#e58b45 32% 62%,#3f6fb5 62% 100%);
}

/* الشريط الجانبي */
body.theme-asr .sidebar{
 background:
  linear-gradient(180deg,#13213a 0%,#182a49 100%)!important;
 border-left:0!important;
}
body.theme-asr .sidebar::before{
 content:"";
 display:block;
 height:5px;
 background:linear-gradient(90deg,#d9534f,#e58b45,#3f6fb5);
}
body.theme-asr .sidebar .nav button{
 position:relative;
 border-radius:10px!important;
 margin:2px 7px!important;
}
body.theme-asr .sidebar .nav button:hover{
 background:rgba(255,255,255,.07)!important;
}
body.theme-asr .sidebar .nav button.active{
 background:rgba(255,255,255,.10)!important;
 box-shadow:none!important;
}
body.theme-asr .sidebar .nav button.active::before{
 content:"";
 position:absolute;
 right:0;top:8px;bottom:8px;width:4px;
 border-radius:4px;
 background:linear-gradient(180deg,#d9534f,#e58b45,#3f6fb5);
}

/* بطاقات لوحة التحكم بشكل Bar Accent مختلف */
body.theme-asr .dashboard-grid > *,
body.theme-asr .cards > *,
body.theme-asr .video-grid > *,
body.theme-asr .video-card,
body.theme-asr .module-card,
body.theme-asr .dash-card{
 position:relative;
 overflow:hidden;
 border:1px solid #e1e7ef!important;
 padding-top:18px!important;
}
body.theme-asr .dashboard-grid > *::before,
body.theme-asr .cards > *::before,
body.theme-asr .video-grid > *::before,
body.theme-asr .video-card::before,
body.theme-asr .module-card::before,
body.theme-asr .dash-card::before{
 content:"";
 position:absolute;
 top:0;right:0;left:0;
 height:5px;
 background:linear-gradient(90deg,#d9534f 0 30%,#e58b45 30% 60%,#3f6fb5 60% 100%);
}
body.theme-asr .dashboard-grid > *:nth-child(3n+1)::before,
body.theme-asr .cards > *:nth-child(3n+1)::before,
body.theme-asr .video-card:nth-child(3n+1)::before{
 background:linear-gradient(90deg,#d9534f,#e58b45);
}
body.theme-asr .dashboard-grid > *:nth-child(3n+2)::before,
body.theme-asr .cards > *:nth-child(3n+2)::before,
body.theme-asr .video-card:nth-child(3n+2)::before{
 background:linear-gradient(90deg,#3f6fb5,#6f8fc6);
}
body.theme-asr .dashboard-grid > *:nth-child(3n)::before,
body.theme-asr .cards > *:nth-child(3n)::before,
body.theme-asr .video-card:nth-child(3n)::before{
 background:linear-gradient(90deg,#e58b45,#d9534f,#3f6fb5);
}

/* أيقونات العصر بألوان متعاقبة */
body.theme-asr .dashboard-grid > *:nth-child(3n+1) .ico,
body.theme-asr .cards > *:nth-child(3n+1) .ico,
body.theme-asr .video-card:nth-child(3n+1) .ico,
body.theme-asr .module-item:nth-child(3n+1) .module-icon{
 background:#fff0eb!important;color:#c95045!important;
}
body.theme-asr .dashboard-grid > *:nth-child(3n+2) .ico,
body.theme-asr .cards > *:nth-child(3n+2) .ico,
body.theme-asr .video-card:nth-child(3n+2) .ico,
body.theme-asr .module-item:nth-child(3n+2) .module-icon{
 background:#eef4ff!important;color:#3f6fb5!important;
}
body.theme-asr .dashboard-grid > *:nth-child(3n) .ico,
body.theme-asr .cards > *:nth-child(3n) .ico,
body.theme-asr .video-card:nth-child(3n) .ico,
body.theme-asr .module-item:nth-child(3n) .module-icon{
 background:#fff4e7!important;color:#d77b36!important;
}

/* العناوين والبار الداخلي */
body.theme-asr .toolbar{
 position:relative;
 padding-bottom:14px!important;
}
body.theme-asr .toolbar::after{
 content:"";
 position:absolute;
 right:0;bottom:0;
 width:120px;height:3px;border-radius:4px;
 background:linear-gradient(90deg,#d9534f,#e58b45,#3f6fb5);
}

/* الجداول */
body.theme-asr table th{
 background:#eef2f7!important;
 color:#21314f!important;
 border-bottom:2px solid #d7e0eb!important;
}
body.theme-asr table tbody tr:hover{
 background:#f7f9fc!important;
}

/* أزرار رئيسية */
body.theme-asr .btn.gold{
 background:linear-gradient(90deg,#df754d,#d95d48)!important;
 color:#fff!important;
 border:0!important;
}
body.theme-asr .btn.gold:hover{filter:brightness(.98)}

/* النوافذ */
body.theme-asr .modalbox{
 border-top:5px solid transparent!important;
 border-image:linear-gradient(90deg,#d9534f,#e58b45,#3f6fb5) 1!important;
}

/* شاشة الدخول - نفس هوية العصر */
body.theme-asr .login{
 background:
  radial-gradient(circle at 20% 20%,rgba(63,111,181,.10),transparent 32%),
  radial-gradient(circle at 80% 85%,rgba(225,104,63,.10),transparent 30%),
  #f4f6fa!important;
}
body.theme-asr .loginbox{
 position:relative;
 overflow:hidden;
}
body.theme-asr .loginbox::before{
 content:"";
 position:absolute;
 top:0;right:0;left:0;height:6px;
 background:linear-gradient(90deg,#d9534f,#e58b45,#3f6fb5);
}


/* إضافة عقار جديد */
.property-form{display:grid;gap:16px}
.property-section{background:var(--theme-surface,#fff);border:1px solid var(--theme-border,#e5e7eb);border-radius:16px;padding:16px}
.property-section h3{margin:0 0 14px}
.property-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.property-grid .wide{grid-column:span 2}.property-grid .full{grid-column:1/-1}
.owner-share-row{display:grid;grid-template-columns:1fr 150px 44px;gap:8px;align-items:end;margin:8px 0}
.owner-share-total{font-weight:800;margin-top:8px}
.owner-share-total.bad{color:#b42318}.owner-share-total.good{color:#16803c}
.property-upload{border:1px dashed var(--theme-border,#d5dae2);border-radius:14px;padding:12px;text-align:center}
.property-upload img{max-width:100%;max-height:180px;border-radius:10px;display:block;margin:8px auto}
.unit-builder{width:100%;max-height:72vh;overflow-y:auto;overflow-x:hidden}
.modalbox.unit-modal-wide{width:98vw;max-width:98vw;height:auto;max-height:94vh;padding:16px}
.unit-card{
 display:grid;
 grid-template-columns:repeat(6,minmax(0,1fr));
 gap:10px;
 padding:14px;
 margin:0 0 12px;
 border:1px solid var(--theme-border,#e5e7eb);
 border-radius:16px;
 background:var(--theme-surface-2,#fafafa);
}
.unit-card-title{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:2px}
.unit-field{min-width:0}
.unit-field label{
 display:flex;align-items:center;justify-content:space-between;gap:8px;
 font-size:12px;font-weight:800;margin:0 0 6px;
}
.unit-field input,.unit-field select{width:100%;min-width:0}
.unit-mode-strip{
 display:inline-flex;align-items:center;gap:2px;
 background:var(--theme-surface,#fff);
 border:1px solid var(--theme-border,#dfe5ee);
 border-radius:999px;padding:2px;white-space:nowrap;
}
.unit-mode-strip button{
 border:0;background:transparent;border-radius:999px;
 padding:4px 8px;font-size:11px;cursor:pointer;color:var(--theme-muted,#667085);
}
.unit-mode-strip button.active{
 background:var(--theme-accent,#d39a43);
 color:#fff;
}
.unit-field.span-2{grid-column:span 2}
.unit-field.span-3{grid-column:span 3}
.unit-field.total-field input{font-weight:800;background:var(--theme-surface,#fff)}
@media(max-width:1200px){.unit-card{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:850px){.unit-card{grid-template-columns:repeat(2,minmax(0,1fr))}.modalbox.unit-modal-wide{width:99vw;max-width:99vw}}
@media(max-width:520px){.unit-card{grid-template-columns:1fr}.unit-field.span-2,.unit-field.span-3{grid-column:span 1}}
@media(max-width:900px){.property-grid{grid-template-columns:1fr 1fr}.property-grid .wide{grid-column:span 2}}
@media(max-width:600px){.property-grid{grid-template-columns:1fr}.property-grid .wide{grid-column:span 1}.owner-share-row{grid-template-columns:1fr 100px 40px}}


/* تبويبات سريعة قابلة للسحب من القائمة الجانبية */
.quick-tabs{
 display:flex;align-items:center;gap:7px;min-height:44px;
 padding:6px 14px;border-bottom:1px solid var(--theme-border,#e5e7eb);
 background:var(--theme-topbar,#fff);overflow-x:auto;overflow-y:hidden;
}
.quick-tabs:empty{display:none}
.quick-tabs.drag-over{outline:2px dashed var(--theme-accent,#b79255);outline-offset:-4px}
.quick-tab{
 display:inline-flex;align-items:center;gap:7px;flex:0 0 auto;
 border:1px solid var(--theme-border,#e5e7eb);background:var(--theme-surface,#fff);
 color:var(--theme-text,#172033);border-radius:10px;padding:7px 10px;
 font:inherit;font-size:12px;cursor:pointer;box-shadow:0 2px 8px rgba(17,24,39,.04);
}
.quick-tab:hover{border-color:var(--theme-accent,#b79255)}
.quick-tab .tab-close{
 border:0;background:transparent;color:var(--theme-muted,#6b7280);
 padding:0 2px;cursor:pointer;font-size:14px;line-height:1;
}
.sidebar .sub button[draggable="true"]{cursor:grab}
.sidebar .sub button.dragging{opacity:.45}


/* =========================================================
   V9 — واجهات أكثر كثافة ووضوحًا على مستوى البرنامج كله
   تعديل بصري فقط: تقليل المسافات والأحجام لإظهار بيانات أكثر
   ========================================================= */
:root{
 --compact-gap:9px;
 --compact-radius:13px;
 --compact-field-h:36px;
}
body{font-size:13px}
.top{min-height:54px;padding:8px 16px}
.top h2{font-size:18px;margin:0}
.wrap{padding:12px 14px}
.toolbar{gap:10px;margin-bottom:10px}
.toolbar h1{font-size:21px;margin:0 0 3px}
.toolbar .muted{font-size:12px}

.card,.panel,.section,.property-section{
 border-radius:var(--compact-radius);
}
.card,.panel,.section{padding:12px}
.property-section{padding:12px}
.property-section h3{font-size:16px;margin:0 0 10px}

.cards{gap:10px}
.cards > *{min-height:0}
.dashboard-card,.stat-card,.launcher-card{padding:12px!important}

.form-grid,.property-grid{
 gap:var(--compact-gap)!important;
}
.property-grid{
 grid-template-columns:repeat(5,minmax(0,1fr));
}
.field{min-width:0}
.field label{
 display:block;
 font-size:11px;
 font-weight:800;
 margin:0 0 4px;
 line-height:1.25;
}
.field input,
.field select,
.field textarea{
 width:100%;
 min-height:var(--compact-field-h);
 padding:7px 9px;
 font-size:12px;
 border-radius:10px;
}
.field textarea{min-height:64px;resize:vertical}
.btn{
 min-height:34px;
 padding:7px 11px;
 border-radius:10px;
 font-size:12px;
}
.iconbtn{width:34px;height:34px}
.tablewrap{border-radius:12px}
table{font-size:12px}
th,td{padding:7px 8px!important}
th{white-space:nowrap}

.modalbox{
 width:min(92vw,1100px);
 max-height:92vh;
 overflow:auto;
 padding:13px;
 border-radius:16px;
}
.modalbox h2,.modalbox h3{margin-top:0}
.modalbox.unit-modal-wide{
 width:99vw;
 max-width:99vw;
 max-height:96vh;
 padding:10px 12px;
}

.owner-share-row{
 grid-template-columns:minmax(180px,1fr) 120px 38px;
 gap:7px;
 margin:6px 0;
}
.property-upload{padding:8px}
.property-upload img{max-height:130px}

.unit-builder{
 max-height:78vh;
}
.unit-card{
 grid-template-columns:repeat(8,minmax(0,1fr));
 gap:7px;
 padding:10px;
 margin-bottom:9px;
 border-radius:13px;
}
.unit-card-title{margin-bottom:0}
.unit-field label{font-size:10.5px;margin-bottom:4px}
.unit-field input,.unit-field select{
 min-height:32px;
 padding:5px 7px;
 font-size:11px;
 border-radius:9px;
}
.unit-mode-strip{padding:1px}
.unit-mode-strip button{padding:3px 6px;font-size:10px}

.quick-tabs{min-height:38px;padding:4px 10px}
.quick-tab{padding:5px 8px;font-size:11px}

.sidebar .brand{padding-top:12px;padding-bottom:12px}
.sidebar .group > button,
.sidebar .sub button{
 min-height:34px!important;
 padding-top:7px!important;
 padding-bottom:7px!important;
 font-size:12px!important;
}
.sidebar .sub{gap:2px!important}

@media(min-width:1500px){
 .property-grid{grid-template-columns:repeat(6,minmax(0,1fr))}
 .unit-card{grid-template-columns:repeat(9,minmax(0,1fr))}
 .wrap{padding:10px 16px}
}
@media(max-width:1200px){
 .property-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
 .unit-card{grid-template-columns:repeat(6,minmax(0,1fr))}
}
@media(max-width:900px){
 .property-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
 .unit-card{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media(max-width:650px){
 body{font-size:12px}
 .wrap{padding:9px}
 .property-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .unit-card{grid-template-columns:repeat(2,minmax(0,1fr))}
 .property-grid .wide,.unit-field.span-2,.unit-field.span-3{grid-column:span 2}
}
@media(max-width:430px){
 .property-grid,.unit-card{grid-template-columns:1fr}
 .property-grid .wide,.unit-field.span-2,.unit-field.span-3{grid-column:span 1}
}


/* V10 — إضافة وحدة مستقلة بنفس بيانات وحدات العقار */
.standalone-unit-page{max-width:none}
.standalone-unit-header{
 display:flex;align-items:center;justify-content:space-between;gap:12px;
 margin-bottom:10px;
}
.standalone-unit-grid{
 display:grid;
 grid-template-columns:repeat(6,minmax(0,1fr));
 gap:9px;
}
.standalone-unit-grid .field.span-2{grid-column:span 2}
.standalone-unit-grid .field.span-3{grid-column:span 3}
.standalone-unit-code{
 direction:ltr;text-align:left;font-weight:800;letter-spacing:.3px;
 background:var(--theme-surface-2,#f8fafc);
}
@media(max-width:1200px){.standalone-unit-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:800px){.standalone-unit-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){
 .standalone-unit-grid{grid-template-columns:1fr}
 .standalone-unit-grid .field.span-2,.standalone-unit-grid .field.span-3{grid-column:span 1}
}


/* V11 — إدارة المستأجرين */
.tenant-page{max-width:none}
.tenant-header{
 display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px
}
.tenant-header h1{margin:0}
.tenant-grid{
 display:grid;grid-template-columns:repeat(6,minmax(0,1fr));
 gap:9px
}
.tenant-grid .span-2{grid-column:span 2}
.tenant-grid .span-3{grid-column:span 3}
.tenant-code{
 direction:ltr;text-align:left;font-weight:800;background:var(--theme-surface-2,#f8fafc)
}
.tenant-upload{
 border:1px dashed var(--theme-border,#d7dce4);
 border-radius:13px;padding:9px;min-height:126px;
 display:flex;flex-direction:column;gap:7px;justify-content:center
}
.tenant-upload img{
 width:100%;max-height:110px;object-fit:contain;border-radius:10px
}
.tenant-actions{display:flex;gap:7px;justify-content:flex-end;margin-top:10px}
.tenant-list-name{font-weight:800}
@media(max-width:1200px){.tenant-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:850px){.tenant-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){
 .tenant-grid{grid-template-columns:1fr}
 .tenant-grid .span-2,.tenant-grid .span-3{grid-column:span 1}
}


/* V12 — قوائم اختيار قابلة للبحث على مستوى البرنامج كله */
.smart-select-wrap{
 position:relative;
 width:100%;
 min-width:0;
}
.smart-select-wrap > select.smart-select-native{
 position:absolute!important;
 opacity:0!important;
 pointer-events:none!important;
 width:1px!important;
 height:1px!important;
 min-height:0!important;
 padding:0!important;
 margin:0!important;
 border:0!important;
}
.smart-select-input{
 width:100%;
 min-height:var(--compact-field-h,36px);
 padding:7px 30px 7px 9px!important;
 font-size:12px!important;
 border-radius:10px!important;
 cursor:text;
 background:var(--theme-surface,#fff);
 color:var(--theme-text,#17233c);
 border:1px solid var(--theme-border,#dfe5ee);
 outline:none;
}
.smart-select-input:focus{
 border-color:var(--theme-accent,#b79255);
 box-shadow:0 0 0 2px color-mix(in srgb,var(--theme-accent,#b79255) 16%,transparent);
}
.smart-select-arrow{
 position:absolute;
 left:9px;
 top:50%;
 transform:translateY(-50%);
 pointer-events:none;
 font-size:11px;
 color:var(--theme-muted,#718096);
}
.smart-select-menu{
 position:absolute;
 z-index:99999;
 top:calc(100% + 4px);
 right:0;
 left:0;
 display:none;
 max-height:198px;
 overflow-y:auto;
 overflow-x:hidden;
 background:var(--theme-surface,#fff);
 border:1px solid var(--theme-border,#dfe5ee);
 border-radius:11px;
 box-shadow:0 12px 28px rgba(17,24,39,.16);
 padding:4px;
}
.smart-select-wrap.open .smart-select-menu{display:block}
.smart-select-option{
 width:100%;
 border:0;
 background:transparent;
 color:var(--theme-text,#17233c);
 text-align:right;
 padding:7px 9px;
 border-radius:8px;
 font:inherit;
 font-size:12px;
 line-height:1.25;
 cursor:pointer;
 white-space:normal;
 word-break:break-word;
}
.smart-select-option:hover,
.smart-select-option.active{
 background:var(--theme-accent-soft,#f5efe5);
}
.smart-select-empty{
 padding:9px;
 text-align:center;
 color:var(--theme-muted,#718096);
 font-size:11px;
}
.smart-select-menu::-webkit-scrollbar{width:7px}
.smart-select-menu::-webkit-scrollbar-thumb{
 background:color-mix(in srgb,var(--theme-muted,#718096) 38%,transparent);
 border-radius:99px;
}
.smart-select-wrap.disabled .smart-select-input{
 opacity:.65;
 cursor:not-allowed;
 background:var(--theme-surface-2,#f8fafc);
}


/* V13 — عرض المستأجرين وملف المستأجر */
.tenant-count-badge{display:inline-flex;padding:6px 10px;border-radius:999px;background:var(--theme-accent-soft,#f5efe5);font-weight:800;font-size:12px}
.tenant-row-actions{display:flex;gap:5px;white-space:nowrap}

/* V15 — تنقل داخلي شبيه بالمتصفح داخل البرنامج */

}

/* V17 — تصفية حساب مستأجر */
.settle-toolbar{display:flex;justify-content:space-between;align-items:end;gap:10px;flex-wrap:wrap;margin-bottom:10px}

.settle-summary>div{border:1px solid var(--theme-border,#dfe5ee);border-radius:11px;padding:8px;background:var(--theme-surface,#fff);min-width:0}
.settle-summary small{display:block;color:var(--theme-muted,#718096);font-size:10px;margin-bottom:2px}
.settle-summary b{display:block;font-size:12px;overflow-wrap:anywhere}
.settle-grid{display:grid;grid-template-columns:1.3fr .7fr;gap:10px;margin-top:10px}

/* V21 — إدارة الإيجارات والعقود / عقد جديد */
.contract-page{display:flex;flex-direction:column;gap:10px}
.contract-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.contract-sections{display:grid;grid-template-columns:1fr;gap:10px}

.contract-card>h3{margin:0;padding:9px 11px;background:var(--theme-surface-2,#f8fafc);border-bottom:1px solid var(--theme-border,#dfe5ee);font-size:13px}

.contract-money-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}

.contract-money-box small{display:block;color:var(--theme-muted,#718096);font-size:10px;margin-bottom:3px}
.contract-money-box b{font-size:13px}
.contract-money-box.total{grid-column:span 2}
.contract-mode-row{display:grid;grid-template-columns:1fr 92px;gap:5px}
.contract-schedule-controls{display:grid;grid-template-columns:150px 130px 145px 1fr;gap:8px;align-items:end}
.contract-actions{display:flex;gap:6px;flex-wrap:wrap}

.contract-search-input{width:100%}
.contract-search-menu{position:absolute;z-index:60;right:0;left:0;top:100%;margin-top:3px;max-height:190px;overflow:auto;background:var(--theme-surface,#fff);border:1px solid var(--theme-border,#dfe5ee);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.12);display:none}
.contract-search-wrap.open .contract-search-menu{display:block}
.contract-search-option{padding:8px 9px;cursor:pointer;border-bottom:1px solid var(--theme-border,#edf0f3);font-size:12px}
.contract-search-option:last-child{border-bottom:0}
.contract-search-option:hover{background:var(--theme-surface-2,#f5f6f8)}
.contract-search-empty{padding:9px;color:var(--theme-muted,#718096);font-size:11px}
.contract-vat-note{font-size:10px;color:var(--theme-muted,#718096);margin-top:3px}
@media(max-width:1200px){.contract-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.contract-money-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.contract-schedule-controls{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:800px){.contract-grid{grid-template-columns:1fr}.contract-grid .wide2,.contract-grid .wide4{grid-column:auto}.contract-money-grid{grid-template-columns:1fr 1fr}.contract-money-box.total{grid-column:1/-1}.contract-schedule-controls{grid-template-columns:1fr}}


/* V22 — حالات العقود وطلبات الإخلاء */
.contract-filter-head{display:flex;justify-content:space-between;align-items:end;gap:8px;flex-wrap:wrap;margin-bottom:10px}

.contract-status-summary>div{border:1px solid var(--theme-border,#dfe5ee);border-radius:12px;padding:9px;background:var(--theme-surface,#fff)}

.eviction-days{font-weight:900;font-size:15px}

@media(max-width:1100px){.contract-status-summary{grid-template-columns:repeat(2,minmax(0,1fr))}.eviction-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.eviction-info{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* V24 — إصلاح قوائم اختيار العقد */

 text-align:right;font:inherit
}

<script>
const defaults={
 owners:[], properties:[], units:[], tenants:[], contracts:[], installments:[], payments:[], expenses:[], maintenance:[],
 users:[{id:1,code:'USR-0001',username:'Admin',password:'1234',name:'المستخدم الرئيسي',role:'admin',active:true,isPrimary:true,createdAt:''}],
 auditLogs:[],
 settingsItems:[],
 countries:[],
 regions:[],
 cities:[],
 districts:[],
 banks:[],
 propertyTypes:[],
 unitTypes:[],
 maintenanceTypes:[],
 notificationSettings:null,
 contractClauses:[],
 settlementItems:[],
 tenantSettlements:[],
 evictionRequests:[],
 treasuries:[],
 treasuryMovements:[],
 bankAccounts:[],
 bankMovements:[],
 expenseCategories:[],
 incomeCategories:[],
 paymentVouchers:[],
 receiptVouchers:[],
 cheques:[],
 maintenanceExpenses:[],
 maintenanceReceipts:[],
 electricityBills:[],
 employees:[],
 employeePayrolls:[],
 employeeStatusTypes:[],
 employeeStatusHistory:[],
 saleContracts:[],
 rentalOffers:[],
 customerRequests:[],
 warehouseItems:[],
 warehouseMovements:[],
 archiveCategories:[],
 archiveFiles:[],
 recycleBin:[],
 programData:{
  appName:'الداغر للعقارات',
  appLogo:''
 },
 appearanceSettings:{
  theme:'modern'
 },
 printSettings:{
  officeName:'الداغر للعقارات',
  website:'',
  address:'',
  phone:'',
  email:'',
  falLicense:'',
  commercialLicense:'',
  activity:'',
  logo:''
 }
};
let currentUser={id:1,code:'USR-0001',username:'Admin',name:'المستخدم الرئيسي',role:'admin',active:true,isPrimary:true};
let rawDb=loadDB(), currentPage='dashboard', entityStack=[];
let __archiveSnapshot=structuredClone(rawDb);
function propertyOwnedByScopeRaw(p,ownerId){
 if(!p)return false;
 if(String(p.ownerId||'')===String(ownerId))return true;
 return Array.isArray(p.owners)&&p.owners.some(x=>String(x?.ownerId||x?.id||'')===String(ownerId));
}
function rawPropertyForUnit(u){return (rawDb.properties||[]).find(p=>String(p.id)===String(u?.propertyId))}
function rawUnitForContract(c){return (rawDb.units||[]).find(u=>String(u.id)===String(c?.unitId))}
function rawContractOwned(c,ownerId){
 if(!c)return false;
 if(String(c.ownerId||'')===String(ownerId))return true;
 const u=rawUnitForContract(c),p=rawPropertyForUnit(u);
 return propertyOwnedByScopeRaw(p,ownerId);
}
function ownerScopeId(){return currentUser?.role==='owner'?String(currentUser.ownerId||''):''}
function ownerScopedArray(key,arr){
 if(!Array.isArray(arr)||currentUser?.role!=='owner')return arr;
 const oid=ownerScopeId();
 const alwaysVisible=new Set(['users','auditLogs','settingsItems','countries','regions','cities','districts','banks','propertyTypes','unitTypes','maintenanceTypes','contractClauses','expenseCategories','incomeCategories']);
 if(alwaysVisible.has(key))return arr;
 if(!oid)return [];
 const propIds=new Set((rawDb.properties||[]).filter(p=>propertyOwnedByScopeRaw(p,oid)).map(p=>String(p.id)));
 const unitIds=new Set((rawDb.units||[]).filter(u=>propIds.has(String(u.propertyId))).map(u=>String(u.id)));
 const contractIds=new Set((rawDb.contracts||[]).filter(c=>rawContractOwned(c,oid)).map(c=>String(c.id)));
 const tenantIds=new Set((rawDb.contracts||[]).filter(c=>contractIds.has(String(c.id))).map(c=>String(c.tenantId)));
 const byPropertyUnitContract=(x)=>propIds.has(String(x?.propertyId||''))||unitIds.has(String(x?.unitId||''))||contractIds.has(String(x?.contractId||''));
 switch(key){
  case 'owners': return arr.filter(x=>String(x.id)===oid);
  case 'properties': return arr.filter(x=>propIds.has(String(x.id)));
  case 'units': return arr.filter(x=>unitIds.has(String(x.id)));
  case 'contracts': return arr.filter(x=>contractIds.has(String(x.id)));
  case 'tenants': return arr.filter(x=>tenantIds.has(String(x.id)));
  case 'installments': return arr.filter(x=>contractIds.has(String(x.contractId)));
  case 'payments': return arr.filter(x=>contractIds.has(String(x.contractId))||byPropertyUnitContract(x));
  case 'expenses': return arr.filter(x=>String(x.ownerId||'')===oid||(x.partyType==='owner'&&String(x.partyId||'')===oid)||byPropertyUnitContract(x));
  case 'maintenance': return arr.filter(x=>byPropertyUnitContract(x));
  case 'maintenanceExpenses': return arr.filter(x=>String(x.ownerId||'')===oid||(x.chargeTo==='owner'&&String(x.partyId||'')===oid)||byPropertyUnitContract(x));
  case 'maintenanceReceipts': return arr.filter(x=>(x.payerType==='owner'&&String(x.payerId||'')===oid)||byPropertyUnitContract(x));
  case 'electricityBills': return arr.filter(x=>(x.payerType==='owner'&&String(x.payerId||'')===oid)||unitIds.has(String(x.unitId||'')));
  case 'paymentVouchers': case 'receiptVouchers': return arr.filter(x=>(x.partyType==='owner'&&String(x.partyId||'')===oid)||byPropertyUnitContract(x));
  case 'cheques': return arr.filter(x=>contractIds.has(String(x.contractId||''))||String(x.ownerId||'')===oid||byPropertyUnitContract(x));
  case 'tenantSettlements': case 'evictionRequests': return arr.filter(x=>contractIds.has(String(x.contractId||''))||tenantIds.has(String(x.tenantId||''))||byPropertyUnitContract(x));
  case 'treasuryMovements': case 'bankMovements': return arr.filter(x=>String(x.ownerId||'')===oid||contractIds.has(String(x.contractId||''))||byPropertyUnitContract(x));
  case 'rentalOffers': return arr.filter(x=>String(x.ownerId||x.linkedOwnerId||'')===oid||propIds.has(String(x.propertyId||''))||unitIds.has(String(x.unitId||'')));
  case 'saleContracts': return arr.filter(x=>String(x.ownerId||x.sellerOwnerId||'')===oid||propIds.has(String(x.propertyId||''))||unitIds.has(String(x.unitId||'')));
  case 'customerRequests': {
   const visibleOfferIds=new Set((rawDb.rentalOffers||[]).filter(x=>String(x.ownerId||x.linkedOwnerId||'')===oid||propIds.has(String(x.propertyId||''))||unitIds.has(String(x.unitId||''))).map(x=>String(x.id)));
   return arr.filter(x=>visibleOfferIds.has(String(x.matchedOfferId||'')));
  }
  case 'warehouseItems': return arr.filter(x=>String(x.ownerId||'')===oid||propIds.has(String(x.propertyId||''))||unitIds.has(String(x.unitId||'')));
  case 'warehouseMovements': {
   const visibleItemIds=new Set((rawDb.warehouseItems||[]).filter(x=>String(x.ownerId||'')===oid||propIds.has(String(x.propertyId||''))||unitIds.has(String(x.unitId||''))).map(x=>String(x.id)));
   return arr.filter(x=>visibleItemIds.has(String(x.itemId||'')));
  }
  case 'treasuries': case 'bankAccounts': case 'employees': case 'employeePayrolls': case 'employeeStatusTypes': case 'employeeStatusHistory': return [];
  default: return arr;
 }
}
function makeScopedDb(target){return new Proxy(target,{get(t,k,r){const v=Reflect.get(t,k,r);return Array.isArray(v)?ownerScopedArray(String(k),v):v},set(t,k,v,r){return Reflect.set(t,k,v,r)}})}
let db=makeScopedDb(rawDb);
function replaceDb(next){rawDb=next;db=makeScopedDb(rawDb);__archiveSnapshot=structuredClone(rawDb)}
if(!Array.isArray(rawDb.tenants))rawDb.tenants=[];
function ensureUsersData(){
 if(!Array.isArray(db.users))db.users=[];
 let primary=db.users.find(u=>u&&u.isPrimary)||db.users.find(u=>String(u.code)==='USR-0001')||db.users[0];
 if(!primary){primary={id:1,code:'USR-0001',username:'Admin',password:'1234',name:'المستخدم الرئيسي',role:'admin',active:true,isPrimary:true,recoveryCode:'',createdAt:nowStamp()};db.users.push(primary)}
 primary.isPrimary=true; primary.role='admin'; if(primary.active===undefined)primary.active=true; if(primary.recoveryCode===undefined)primary.recoveryCode='';
 if(!primary.username || primary.username==='manager')primary.username='Admin';
 if(!primary.password)primary.password='1234';
 if(!primary.name || primary.name==='مدير النظام')primary.name='المستخدم الرئيسي';
 db.users.forEach((u,i)=>{if(!u.code)u.code='USR-'+String(i+1).padStart(6,'0');if(!u.role||u.role==='manager')u.role=u.isPrimary?'admin':'reviewer';if(u.active===undefined)u.active=true;if(!u.password)u.password='1234';if(u.recoveryCode===undefined)u.recoveryCode=''});
 return db.users;
}
ensureUsersData();


/* V-FINAL — طبقة التكامل المركزية بين وحدات البرنامج */
const CORE_COLLECTIONS=['owners','properties','units','tenants','contracts','installments','payments','expenses','maintenance','users','auditLogs','settingsItems','countries','regions','cities','districts','banks','propertyTypes','unitTypes','maintenanceTypes','contractClauses','settlementItems','tenantSettlements','evictionRequests','treasuries','treasuryMovements','bankAccounts','bankMovements','expenseCategories','incomeCategories','paymentVouchers','receiptVouchers','cheques','maintenanceExpenses','maintenanceReceipts','electricityBills','employees','employeePayrolls','employeeStatusTypes','employeeStatusHistory','saleContracts','rentalOffers','customerRequests','warehouseItems','warehouseMovements','archiveCategories','archiveFiles','recycleBin'];
function ensureCoreCollections(){
 CORE_COLLECTIONS.forEach(k=>{if(!Array.isArray(rawDb[k]))rawDb[k]=[]});
 if(!rawDb.programData||typeof rawDb.programData!=='object')rawDb.programData=structuredClone(defaults.programData);
 if(!rawDb.appearanceSettings||typeof rawDb.appearanceSettings!=='object')rawDb.appearanceSettings=structuredClone(defaults.appearanceSettings);
 if(!rawDb.printSettings||typeof rawDb.printSettings!=='object')rawDb.printSettings=structuredClone(defaults.printSettings);
}
function primaryOwnerIdForProperty(p){
 if(!p)return '';
 if(p.ownerId!==undefined&&p.ownerId!==null&&String(p.ownerId)!=='')return p.ownerId;
 return Array.isArray(p.owners)&&p.owners.length?(p.owners[0].ownerId??p.owners[0].id??''):'';
}
function safeLinkedPropertyId(x){
 if(!x)return '';
 if(x.propertyId!==undefined&&x.propertyId!==null&&String(x.propertyId)!=='')return x.propertyId;
 const u=(rawDb.units||[]).find(v=>String(v.id)===String(x.unitId||''));
 return u?.propertyId??'';
}
function safeLinkedOwnerId(x){
 if(!x)return '';
 if(x.ownerId!==undefined&&x.ownerId!==null&&String(x.ownerId)!=='')return x.ownerId;
 const pid=safeLinkedPropertyId(x),p=(rawDb.properties||[]).find(v=>String(v.id)===String(pid));
 return primaryOwnerIdForProperty(p);
}
function syncSafeDerivedLinks(){
 ensureCoreCollections();let changed=0;
 // العقار: توحيد المالك الرئيسي وقائمة نسب الملكية بدون حذف أي بيانات.
 rawDb.properties.forEach(p=>{
  if((!Array.isArray(p.owners)||!p.owners.length)&&p.ownerId){p.owners=[{ownerId:p.ownerId,share:100}];changed++}
  if((p.ownerId===undefined||p.ownerId===null||String(p.ownerId)==='')&&Array.isArray(p.owners)&&p.owners.length){p.ownerId=p.owners[0].ownerId??p.owners[0].id;changed++}
 });
 // العقد هو نقطة الربط الأساسية: الوحدة تحدد العقار، والعقار يحدد المالك عند غياب الربط.
 rawDb.contracts.forEach(c=>{
  const u=rawDb.units.find(v=>String(v.id)===String(c.unitId||''));
  if(u&&String(c.propertyId||'')!==String(u.propertyId||'')){c.propertyId=u.propertyId;changed++}
  const p=rawDb.properties.find(v=>String(v.id)===String(c.propertyId||u?.propertyId||''));
  if(p&&(c.ownerId===undefined||c.ownerId===null||String(c.ownerId)==='')){const oid=primaryOwnerIdForProperty(p);if(oid!==''){c.ownerId=oid;changed++}}
 });
 // الوحدات التشغيلية التابعة: إذا وُجدت وحدة صحيحة نثبت العقار المشتق منها.
 ['maintenance','maintenanceExpenses','maintenanceReceipts','electricityBills','warehouseItems','warehouseMovements','cheques','paymentVouchers','receiptVouchers','treasuryMovements','bankMovements'].forEach(k=>{
  (rawDb[k]||[]).forEach(x=>{
   if(x.unitId){const u=rawDb.units.find(v=>String(v.id)===String(x.unitId));if(u&&(x.propertyId===undefined||x.propertyId===null||String(x.propertyId)==='')){x.propertyId=u.propertyId;changed++}}
   if(x.contractId){const c=rawDb.contracts.find(v=>String(v.id)===String(x.contractId));if(c){if((x.unitId===undefined||x.unitId===null||String(x.unitId)==='')&&c.unitId){x.unitId=c.unitId;changed++}if((x.propertyId===undefined||x.propertyId===null||String(x.propertyId)==='')&&c.propertyId){x.propertyId=c.propertyId;changed++}if((x.ownerId===undefined||x.ownerId===null||String(x.ownerId)==='')&&c.ownerId){x.ownerId=c.ownerId;changed++}}}
  });
 });
 // المصروف المرتبط بعقار يرث المالك فقط عند عدم وجود تحديد صريح.
 rawDb.expenses.forEach(x=>{if(x.propertyId&&(x.ownerId===undefined||x.ownerId===null||String(x.ownerId)==='')){const p=rawDb.properties.find(v=>String(v.id)===String(x.propertyId));const oid=primaryOwnerIdForProperty(p);if(oid!==''){x.ownerId=oid;changed++}}});
 // عروض داخلية وعقود بيع داخلية: ربط مشتق دون تحويل العناصر الخارجية إلى أملاك مدارة.
 [...rawDb.rentalOffers,...rawDb.saleContracts].forEach(x=>{

function captureDeletedRecords(){

 const batchId='DEL-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);

 for(const [key,oldArr] of Object.entries(__archiveSnapshot)){
  if(skip.has(key)||!Array.isArray(oldArr)||!Array.isArray(rawDb[key]))continue;

  for(const old of oldArr){
   const rid=String(old?.id??old?.code??''); if(!rid||ids.has(rid))continue;

   deleted.push({id:uid(),batchId,collection:key,collectionLabel:archiveCollectionLabel(key),recordId:old?.id??old?.code,displayName:recycleDisplayName(key,old),data:structuredClone(old),deletedAt:nowStamp(),deletedBy:currentUser?.name||currentUser?.username||'مستخدم',deletedById:currentUser?.id||'',sourcePage:currentPage||'',permanent:false});

function enableBrowserTabDragging(root=document){
 root.querySelectorAll('#app [onclick]').forEach(el=>{
  if(el.dataset.browserTabDragReady==='1')return;
  const action=cleanInternalAction(el.getAttribute('onclick')||'');
  if(!isInternalPageAction(action))return;
  el.dataset.browserTabDragReady='1';
  el.setAttribute('draggable','true');
  el.addEventListener('dragstart',e=>{
   const currentAction=cleanInternalAction(el.getAttribute('onclick')||'');
   if(!isInternalPageAction(currentAction)){e.preventDefault();return}
   const url=browserDeepLinkUrl(currentAction);
   const payload=JSON.stringify({label:(el.textContent||el.getAttribute('title')||'صفحة').trim(),action:currentAction});
   try{
    e.dataTransfer.setData('text/uri-list',url);
    e.dataTransfer.setData('text/plain',url);
    e.dataTransfer.setData('text/x-moz-url',url+'\\n'+((el.textContent||'الداغر للعقارات').trim()));
    e.dataTransfer.setData('application/x-aldagher-tab',payload);
    e.dataTransfer.effectAllowed='copyLink';
   }catch(err){console.error(err)}
  });
 });
}

 try{
  appNavExecuting=true;
  Function(action)();
  appNavExecuting=false;
  currentInternalAction=action;
  activeQuickTabAction=action;
  if(opts.record!==false)recordInternalNavigation(action,opts.label||'');
  renderQuickTabs();
  updateAppNavButtons();
  return true;
 }catch(e){
  appNavExecuting=false;
  console.error(e);
  flash('تعذر فتح الصفحة داخل البرنامج');
  return false;
 }
}
function recordInternalNavigation(action,label=''){

 if(current && current.action===action){
  currentInternalAction=action;updateAppNavButtons();return;
 }
 appNavHistory.splice(appNavIndex+1);

}
function appNavBack(){

}
function appNavForward(){

 const x=appNavHistory[appNavIndex];
 executeInternalAction(x.action,{record:false,label:x.label});
}
function appNavReload(){

}

function counts(){

 const vacant=db.units.filter(x=>x.status==='شاغرة').length;

 const exp=db.expenses.reduce((s,x)=>s+Number(x.amount||0),0);

}

function ownerCodePrefix(code){
 const m=String(code||'').toUpperCase().match(/^([A-Z]{2,5})/);
 return m?m[1]:'';
}
function nextOwnerSequence(){
 let max=0;
 db.owners.forEach(o=>{
  const m=String(o.code||'').match(/(\d+)\s*$/);
  if(m)max=Math.max(max,Number(m[1])||0);
 });
 return max+1;
}
function generateOwnerCode(){
 const used=new Set(db.owners.map(o=>ownerCodePrefix(o.code)).filter(Boolean));
 const letters='ABCDEFGHJKLMNPQRSTUVWXYZ';
 let prefix='';
 for(let tries=0;tries<5000;tries++){
  prefix='';
  for(let i=0;i<3;i++)prefix+=letters[Math.floor(Math.random()*letters.length)];
  if(!used.has(prefix))break;
 }
 if(!prefix || used.has(prefix)){
  // احتياط نظري إذا امتلأت التركيبات العشوائية
  let n=0;
  do{
   prefix=letters[Math.floor(n/(letters.length*letters.length))%letters.length]+
          letters[Math.floor(n/letters.length)%letters.length]+
          letters[n%letters.length];
   n++;
  }while(used.has(prefix));
 }
 return `${prefix}-${String(nextOwnerSequence()).padStart(3,'0')}`;
}

function reportISOStartOfMonth(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`}
function reportISOEndOfMonth(){const d=new Date(),x=new Date(d.getFullYear(),d.getMonth()+1,0);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`}
function reportDateInRange(v,from,to){const d=String(v||'').slice(0,10);return (!from||d>=from)&&(!to||d<=to)}
function reportOwnerOptions(selected=''){return (db.owners||[]).map(o=>`<option value="${o.id}" ${String(selected)===String(o.id)?'selected':''}>${esc(o.code||'')} — ${esc(o.name||'مالك')}</option>`).join('')}

function reportOwnerOfContract(c){if(!c)return null;const u=getUnit(c.unitId),p=getProperty(c.propertyId||u?.propertyId);return getOwner(c.ownerId||p?.ownerId||p?.owners?.[0]?.ownerId)}
function reportPropertyOfContract(c){const u=getUnit(c?.unitId);return getProperty(c?.propertyId||u?.propertyId)}
function reportContractOwnerId(c){return String(reportOwnerOfContract(c)?.id||c?.ownerId||'')}
function reportPaymentBaseRent(p,c){
 const total=Number(c?.tenantTotal||0)||Number(c?.rent||0)+Number(c?.waterAmount||c?.water||0)+Number(c?.servicesAmount||c?.services||0)+Number(c?.vatAmount||0);
 const rent=Number(c?.rent||0);if(total<=0||rent<=0)return 0;return Math.max(0,Number(p?.amount||0))*rent/total;
}
function reportMgmtRate(c){

function reportOwnerExpenses(ownerId,from,to){

 (db.expenses||[]).forEach(e=>{const p=e.propertyId?getProperty(e.propertyId):null;if(!reportDateInRange(e.date,from,to))return;if(String(e.ownerId||'')===oid||(p&&propertyBelongsToOwner(p,oid)))rows.push({date:e.date,title:e.title||e.category||'مصروف',category:e.category||'مصروف عام',amount:Number(e.amount||0),property:p?.name||'عام',unit:'',source:'مصروف'})});
 (db.maintenanceExpenses||[]).forEach(e=>{if(!reportDateInRange(e.date,from,to))return;const u=e.unitId?getUnit(e.unitId):null,p=e.propertyId?getProperty(e.propertyId):getProperty(u?.propertyId);const linked=String(e.ownerId||e.partyId||'')===oid||(p&&propertyBelongsToOwner(p,oid));if(linked&&(e.chargeTo==='owner'||e.partyType==='owner'||String(e.ownerId||'')===oid))rows.push({date:e.date,title:e.title||e.description||e.type||'صيانة',category:e.category||e.type||'صيانة',amount:Number(e.amount||e.cost||0),property:p?.name||'',unit:u?.unitNo||u?.code||'',source:'صيانة'})});

function ownerReportUnitKind(u,p){

 return /(تجار|commercial|shop|office|معرض|مكتب)/i.test(txt)?'commercial':'residential';

function ownerReportChargeLabel(key){
 const k=String(key||'').toLowerCase();
 const m={vat:'الضريبة',tax:'الضريبة',water:'المياه',electricity:'الكهرباء',services:'الخدمات / الصيانة',service:'الخدمات / الصيانة',other:'بنود أخرى',rent:'الإيجار'};
 return m[k]||String(key||'بند إضافي');
}
function ownerReportPaymentAllocation(pay,c){
 const amount=Math.max(0,Number(pay?.amount||0)),cat=String(pay?.category||'').trim().toLowerCase();
 const out={rent:0,vat:0,extras:{},total:amount};
 if(cat){
  if(cat==='rent')out.rent=amount;
  else if(cat==='vat'||cat==='tax')out.vat=amount;
  else out.extras[ownerReportChargeLabel(cat)]=amount;
  return out;
 }
 // المدفوعات القديمة غير المصنفة يعاملها النظام كإيجار فقط؛ لا نفترض ضريبة أو خدمة لم تُسجل صراحة.

 return out;
}
function ownerReportPropertySummary(ownerId,from,to,includeDetails=false){
 const oid=String(ownerId),map=new Map();
 (db.properties||[]).filter(p=>propertyBelongsToOwner(p,oid)).forEach(p=>map.set(String(p.id),{property:p,residential:0,commercial:0,vat:0,extras:{}}));
 reportOwnerRentCollections(ownerId,from,to).forEach(x=>{
  const pid=String(x.property?.id||'');if(!pid)return;
  if(!map.has(pid))map.set(pid,{property:x.property,residential:0,commercial:0,vat:0,extras:{}});
  const r=map.get(pid);if(ownerReportUnitKind(x.unit,x.property)==='commercial')r.commercial+=x.baseRent;else r.residential+=x.baseRent;
  r.vat+=Number(x.vatCollected||0);
  Object.entries(x.extras||{}).forEach(([k,v])=>r.extras[k]=(r.extras[k]||0)+Number(v||0));
 });
 return [...map.values()].filter(r=>r.residential||r.commercial||r.vat||Object.values(r.extras).some(Number));
}

function reportOwnerRentCollections(ownerId,from,to){

 (db.payments||[]).forEach(pay=>{if(!reportDateInRange(pay.date,from,to))return;const c=getContract(pay.contractId);if(!c||reportContractOwnerId(c)!==oid)return;const t=getTenant(c.tenantId),u=getUnit(c.unitId),p=reportPropertyOfContract(c),alloc=ownerReportPaymentAllocation(pay,c),rate=reportMgmtRate(c);rows.push({date:pay.date,paymentId:pay.id,contract:c,tenant:t,unit:u,property:p,baseRent:alloc.rent,vatCollected:alloc.vat,extras:alloc.extras,paid:Number(pay.amount||0),totalCollected:Number(pay.amount||0),rate,fee:alloc.rent*rate/100})});
 return rows.sort((a,b)=>String(a.date).localeCompare(String(b.date)));

function programReportData(ownerId='',from='',to=''){
 const oid=String(ownerId||''),isOwner=!!oid;
 const allProps=(db.properties||[]).filter(p=>reportEntityVisibleByEnd(p,to));
 const props=isOwner?allProps.filter(p=>propertyBelongsToOwner(p,oid)):allProps;
 const propIds=new Set(props.map(p=>String(p.id)));
 const units=(db.units||[]).filter(u=>propIds.has(String(u.propertyId))&&reportEntityVisibleByEnd(u,to));
 const unitIds=new Set(units.map(u=>String(u.id)));
 const contracts=(db.contracts||[]).filter(c=>unitIds.has(String(c.unitId))&&(!to||String(c.startDate||'').slice(0,10)<=to)&&(!from||!c.endDate||String(c.endDate).slice(0,10)>=from));
 const contractIds=new Set(contracts.map(c=>String(c.id)));
 const tenantIds=new Set(contracts.map(c=>String(c.tenantId)).filter(Boolean));
 const tenants=(db.tenants||[]).filter(t=>tenantIds.has(String(t.id))&&reportEntityVisibleByEnd(t,to));
 let collections=[],expenses=[],rent=0,vat=0,extras={},fee=0,feeVat=0;
 if(isOwner){
   collections=reportOwnerRentCollections(oid,from,to);
   expenses=reportOwnerExpenses(oid,from,to);
   collections.forEach(x=>{rent+=Number(x.baseRent||0);vat+=Number(x.vatCollected||0);fee+=Number(x.fee||0);Object.entries(x.extras||{}).forEach(([k,v])=>extras[k]=(extras[k]||0)+Number(v||0));});
   feeVat=fee*.15;
 }else{
   collections=(db.payments||[]).filter(p=>reportDateInRange(p.date,from,to));
   expenses=reportExpenseRows(from,to);
   collections.forEach(pay=>{const c=getContract(pay.contractId),a=ownerReportPaymentAllocation(pay,c);rent+=Number(a.rent||0);vat+=Number(a.vat||0);Object.entries(a.extras||{}).forEach(([k,v])=>extras[k]=(extras[k]||0)+Number(v||0));});
 }
 const totalCollected=collections.reduce((s,x)=>s+Number(isOwner?(x.totalCollected??x.paid):x.amount||0),0);
 const totalExpenses=expenses.reduce((s,x)=>s+Number(x.amount||0),0);
 const extrasTotal=Object.values(extras).reduce((s,v)=>s+Number(v||0),0);
 const net=isOwner?(rent+vat+extrasTotal-totalExpenses-fee-feeVat):(totalCollected-totalExpenses);
 return {isOwner,props,units,contracts,tenants,collections,expenses,rent,vat,extras,extrasTotal,fee,feeVat,totalCollected,totalExpenses,net};
}

 currentPage='program_report';topTitle.textContent='تقرير البرنامج';

let tenantAccountSelectedId='';

function tenantAccountContractOwner(c){
 const u=getUnit(c?.unitId);
 const p=getProperty(u?.propertyId);
 let owner=null;
 if(p?.ownerId)owner=getOwner(p.ownerId);
 if(!owner && Array.isArray(p?.owners) && p.owners.length)owner=getOwner(p.owners[0].ownerId);
 return {u,p,owner};
}
function contractDurationText(c){
 if(!c?.startDate || !c?.endDate)return '—';
 const a=new Date(c.startDate),b=new Date(c.endDate);
 if(Number.isNaN(a.getTime())||Number.isNaN(b.getTime()))return '—';
 let months=(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth());
 if(b.getDate()>=a.getDate())months++;
 if(months>=12 && months%12===0)return `${months/12} سنة`;
 if(months>=12)return `${Math.floor(months/12)} سنة و ${months%12} شهر`;
 return `${Math.max(1,months)} شهر`;
}
function contractChargeValue(c,names){
 for(const k of names){
  const v=Number(c?.[k]||0);
  if(v>0)return v;
 }
 return 0;
}
function tenantContractCharges(c){
 return [
  {key:'vat',label:'الضريبة',value:contractChargeValue(c,['vatAmount','vat','taxAmount','tax'])},
  {key:'water',label:'المياه',value:contractChargeValue(c,['waterAmount','water'])},
  {key:'electricity',label:'الكهرباء',value:contractChargeValue(c,['electricityAmount','electricity'])},
  {key:'services',label:'الخدمات / الصيانة',value:contractChargeValue(c,['servicesAmount','services','maintenanceAmount'])},
  {key:'other',label:'بنود أخرى',value:contractChargeValue(c,['otherAmount','otherCharges'])}
 ].filter(x=>x.value>0);
}
function installmentPayments(installmentId){
 return (db.payments||[]).filter(p=>String(p.installmentId||'')===String(installmentId));
}
function installmentPaidActual(i){
 const linked=installmentPayments(i.id).reduce((s,p)=>s+Number(p.amount||0),0);
 return Math.max(Number(i.paid||0),linked);
}
function installmentStatusInfo(i){
 const amount=Number(i.amount||0),paid=Math.min(amount,installmentPaidActual(i));
 if(paid>=amount && amount>0)return {text:'مدفوع',cls:'paid',paid,remaining:0};
 if(paid>0)return {text:'غير مسدد بالكامل',cls:'partial',paid,remaining:Math.max(0,amount-paid)};
 return {text:'غير مدفوع',cls:'unpaid',paid:0,remaining:amount};
}

 if(old && !requireManager())return;
 const st=installmentStatusInfo(i);
 const maxAmount=old?Number(old.amount||0):st.remaining;

 `);

function saveInstallmentPayment(installmentId,paymentId=''){
 const i=(db.installments||[]).find(x=>String(x.id)===String(installmentId));if(!i)return;
 if(paymentId && !requireManager())return;
 const c=getContract(i.contractId);if(!c)return;
 const amount=Number(document.getElementById('tap_amount')?.value||0);
 if(amount<=0){flash('أدخل مبلغًا صحيحًا');return}
 const otherPaid=installmentPayments(i.id).filter(p=>String(p.id)!==String(paymentId)).reduce((s,p)=>s+Number(p.amount||0),0);
 const max=Math.max(0,Number(i.amount||0)-otherPaid);
 if(amount>max+0.001){flash(`المبلغ أكبر من المتبقي على القسط: ${money(max)}`);return}
 let p=paymentId?(db.payments||[]).find(x=>String(x.id)===String(paymentId)):null;
 if(!p){
  p={id:uid(),code:nextCode('RCV',db.payments||[])};
  db.payments.push(p);
 }
 Object.assign(p,{
  contractId:c.id,installmentId:i.id,amount,
  date:document.getElementById('tap_date')?.value||today(),
  method:document.getElementById('tap_method')?.value||'تحويل بنكي',
  notes:document.getElementById('tap_notes')?.value||''
 });
 const tapAccount=document.getElementById('tap_account')?.value||'';
 const tapAcc=parseFinanceAccount(tapAccount);
 p.accountType=tapAcc.accountType||p.accountType||'';
 p.accountId=tapAcc.accountId||p.accountId||'';
 upsertReceiptForPayment(p,{accountValue:tapAccount});
 rebuildContractPayments(c.id);
 if(save()===false)return;
 audit(paymentId?'تعديل دفعة قسط':'دفع قسط مستأجر','إدارة المستأجرين',p.code||String(p.id),`${getTenant(c.tenantId)?.name||''} - ${money(amount)}`);
 closeModal();
 renderTenantAccounts(c.tenantId);
 flash(paymentId?'تم تعديل الدفعة':'تم حفظ الدفعة');
}
function rebuildContractPayments(contractId){
 const inst=(db.installments||[]).filter(i=>i.contractId==contractId).sort((a,b)=>String(a.dueDate).localeCompare(String(b.dueDate)));
 inst.forEach(i=>{i.paid=0;i.status='مستحق'});
 const targeted=(db.payments||[]).filter(p=>p.contractId==contractId && p.installmentId);
 targeted.forEach(p=>{
  const i=inst.find(x=>String(x.id)===String(p.installmentId));if(!i)return;
  i.paid=Math.min(Number(i.amount||0),Number(i.paid||0)+Number(p.amount||0));
 });
 const legacy=(db.payments||[]).filter(p=>p.contractId==contractId && !p.installmentId).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
 legacy.forEach(p=>{
  let remain=Number(p.amount||0);
  inst.forEach(i=>{
   if(remain<=0)return;
   const due=Math.max(0,Number(i.amount||0)-Number(i.paid||0));
   const use=Math.min(remain,due);
   i.paid=Number(i.paid||0)+use;remain-=use;
  });
 });
 inst.forEach(i=>{i.status=Number(i.paid||0)>=Number(i.amount||0)?'مدفوع':Number(i.paid||0)>0?'جزئي':'مستحق'});
}

function daysInclusive(a,b){
 const x=new Date(a+'T00:00:00'),y=new Date(b+'T00:00:00');
 if(Number.isNaN(x.getTime())||Number.isNaN(y.getTime()))return 0;
 return Math.max(0,Math.floor((y-x)/86400000)+1);
}
function prorateAnnualByCalendarDays(annual,start,end){
 annual=Number(annual||0);
 if(!annual||!start||!end||end<start)return 0;
 let cur=new Date(start+'T00:00:00'),last=new Date(end+'T00:00:00'),sum=0;
 while(cur<=last){
  const yr=cur.getFullYear();
  const yearEnd=new Date(yr,11,31);
  const segmentEnd=yearEnd<last?yearEnd:last;
  const segmentDays=Math.floor((segmentEnd-cur)/86400000)+1;
  const leap=new Date(yr,1,29).getMonth()===1;
  sum+=annual*(segmentDays/(leap?366:365));
  cur=new Date(segmentEnd);cur.setDate(cur.getDate()+1);
 }
 return sum;
}

function settlementCoreCalculation(){
 const c=getContract(settlementDraft.contractId);if(!c)return null;
 const t=getTenant(c.tenantId),u=getUnit(c.unitId),p=getProperty(u?.propertyId),o=getOwner(p?.ownerId);
 const start=c.startDate||'',contractEnd=c.endDate||settlementDraft.exitDate;
 let exit=settlementDraft.exitDate||today();
 if(start && exit<start)exit=start;
 if(contractEnd && exit>contractEnd)exit=contractEnd;
 const totalDays=daysInclusive(start,contractEnd);
 const usedDays=daysInclusive(start,exit);
 const remainingDays=Math.max(0,totalDays-usedDays);
 const lines=settlementUnitCharges(c,u).map(x=>{
  const accrued=prorateAnnualByCalendarDays(x.annual,start,exit);
  const paid=contractPaymentsForCategory(c.id,x.key).reduce((s,pay)=>s+Number(pay.amount||0),0);
  return {...x,accrued,paid,balance:paid-accrued};
 });
 // Existing historic payments have no category; they are treated as rent.
 const rentLine=lines.find(x=>x.key==='rent');
 if(rentLine){
  const allUntagged=(db.payments||[]).filter(pay=>String(pay.contractId)===String(c.id) && !pay.category).reduce((s,pay)=>s+Number(pay.amount||0),0);
  const explicitlyRent=(db.payments||[]).filter(pay=>String(pay.contractId)===String(c.id) && pay.category==='rent').reduce((s,pay)=>s+Number(pay.amount||0),0);
  rentLine.paid=allUntagged+explicitlyRent;
  rentLine.balance=rentLine.paid-rentLine.accrued;
 }
 const defaultDeposit=Number(c.depositPaid??c.depositAmount??u?.depositAmount??u?.deposit??0);
 const deposit=settlementDraft.depositOverride===null?defaultDeposit:Number(settlementDraft.depositOverride||0);
 const custom=(settlementDraft.customRows||[]).map(r=>{
  const cfg=getSettlementItems().find(x=>String(x.id)===String(r.itemId));
  const kind=r.kind||cfg?.kind||'deduction';
  const raw=Number(r.amount||0);
  const amount=kind==='periodic_due'?prorateAnnualByCalendarDays(raw,start,exit):raw;
  return {...r,name:r.name||cfg?.name||'بند إضافي',kind,calculated:amount};
 });
 const periodicDue=custom.filter(x=>x.kind==='periodic_due').reduce((s,x)=>s+x.calculated,0);
 const deductions=(settlementDraft.deductions||[]).reduce((s,x)=>s+Number(x.amount||0),0)+custom.filter(x=>x.kind==='deduction').reduce((s,x)=>s+x.calculated,0);
 const credits=custom.filter(x=>x.kind==='tenant_credit').reduce((s,x)=>s+x.calculated,0);
 const coreBalance=lines.reduce((s,x)=>s+x.balance,0); // positive = tenant credit, negative = tenant debt
 const net=deposit+coreBalance+credits-periodicDue-deductions;
 return {c,t,u,p,o,start,contractEnd,exit,totalDays,usedDays,remainingDays,lines,deposit,custom,periodicDue,deductions,credits,coreBalance,net};
}

function settlementSnapshot(){
 const x=settlementCoreCalculation();if(!x)return null;
 return {
  tenantId:x.t?.id,contractId:x.c?.id,unitId:x.u?.id,propertyId:x.p?.id,ownerId:x.o?.id,
  exitDate:x.exit,startDate:x.start,endDate:x.contractEnd,totalDays:x.totalDays,usedDays:x.usedDays,remainingDays:x.remainingDays,
  deposit:x.deposit,lines:x.lines.map(l=>({key:l.key,label:l.label,annual:l.annual,accrued:l.accrued,paid:l.paid,balance:l.balance})),
  deductions:(settlementDraft.deductions||[]).map(d=>({label:d.label||'خصم',amount:Number(d.amount||0)})),
  custom:x.custom.map(r=>({name:r.name,kind:r.kind,amount:Number(r.amount||0),calculated:Number(r.calculated||0)})),
  coreBalance:x.coreBalance,deductionsTotal:x.deductions,periodicDue:x.periodicDue,credits:x.credits,net:x.net,
  notes:settlementDraft.notes||''
 };
}
function saveTenantSettlement(){
 const snap=settlementSnapshot();if(!snap){flash('اختر المستأجر والعقد أولًا');return}
 const record={
  id:uid(),code:nextCode('SET',getTenantSettlements()),...snap,
  status:'معتمد',createdAt:nowStamp(),createdBy:currentUser.username
 };
 getTenantSettlements().push(record);save();
 const t=getTenant(record.tenantId);
 audit('اعتماد تصفية حساب مستأجر','إدارة المستأجرين',record.code,`${t?.name||''} - ${record.net>=0?'رد':'مطالبة'} ${money(Math.abs(record.net))}`);
 flash(`تم حفظ التصفية برقم ${record.code}`);
 renderSettlementHistory(record.id);
}
function settlementDocumentBody(snap,code='معاينة'){
