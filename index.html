<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>الداغر للعقارات</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:Arial,sans-serif}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:#fff;z-index:3;color:#222}
.spinner{width:44px;height:44px;border:4px solid #ddd;border-top-color:#111;border-radius:50%;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
#app{display:none;border:0;width:100%;height:100%;position:fixed;inset:0;background:#fff}
#err{display:none;max-width:680px;padding:20px;text-align:center;line-height:1.8;color:#a00}
</style>
</head>
<body>
<div id="loading"><div class="spinner"></div><div>جاري تشغيل برنامج الداغر للعقارات...</div><div id="err"></div></div>
<iframe id="app" title="الداغر للعقارات"></iframe>
<script>
(()=>{
'use strict';
const DB_KEY='aldagher_db_v1';
const APP_SESSION_KEY='aldagher_session_v1';
const CLOUD_TOKEN_KEY='aldagher_cloud_token_netlify_v1';
let cloudToken=localStorage.getItem(CLOUD_TOKEN_KEY)||'';
let pendingSnapshot=''; let saveTimer=0; let saveInFlight=false;
const frame=document.getElementById('app'); const loading=document.getElementById('loading'); const err=document.getElementById('err');
async function api(path,body){
 const r=await fetch(path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body||{})});
 let data={}; try{data=await r.json()}catch{}
 if(!r.ok) throw new Error(data.message||'تعذر الاتصال بالسحابة');
 return data;
}
function parseUsers(snapshot){try{const d=JSON.parse(snapshot);return Array.isArray(d.users)?d.users:[]}catch{return[]}}
function localDb(){return localStorage.getItem(DB_KEY)||''}
async function cloudLogin(username,password,candidateSnapshot=''){return api('/api/cloud/login',{username,password,candidateSnapshot:candidateSnapshot||undefined})}
async function restoreBeforeBoot(){
 const snap=localDb(); const sid=localStorage.getItem(APP_SESSION_KEY)||'';
 if(cloudToken){
   try{const d=await api('/api/cloud/snapshot',{token:cloudToken}); if(d.snapshot)localStorage.setItem(DB_KEY,d.snapshot); return}
   catch(e){cloudToken='';localStorage.removeItem(CLOUD_TOKEN_KEY)}
 }
 if(!snap||!sid)return;
 const u=parseUsers(snap).find(x=>String(x.id??'')===String(sid)&&x.active!==false);
 if(!u||!u.username||u.password===undefined)return;
 try{const d=await cloudLogin(String(u.username),String(u.password),snap); if(!d.token)throw 0; cloudToken=d.token;localStorage.setItem(CLOUD_TOKEN_KEY,cloudToken);if(d.snapshot)localStorage.setItem(DB_KEY,d.snapshot)}
 catch{localStorage.removeItem(APP_SESSION_KEY)}
}
function queueSave(s){if(!cloudToken||!s)return;pendingSnapshot=s;clearTimeout(saveTimer);saveTimer=setTimeout(flushSave,350)}
async function flushSave(){if(saveInFlight||!cloudToken||!pendingSnapshot)return;saveInFlight=true;const s=pendingSnapshot;pendingSnapshot='';try{await api('/api/cloud/save',{token:cloudToken,snapshot:s})}catch(e){pendingSnapshot=pendingSnapshot||s;console.error(e)}finally{saveInFlight=false;if(pendingSnapshot)setTimeout(flushSave,600)}}
function installBridge(){
 const w=frame.contentWindow,d=frame.contentDocument;if(!w||!d)return;
 try{
   const sp=Object.getPrototypeOf(w.localStorage); const native=sp.setItem;
   if(!sp.__aldagherCloudPatched){sp.setItem=function(k,v){native.call(this,k,v);if(this===w.localStorage&&k===DB_KEY)queueSave(String(v))};Object.defineProperty(sp,'__aldagherCloudPatched',{value:true})}
 }catch(e){console.warn(e)}
 const origLogin=w.login;
 if(typeof origLogin==='function'&&!origLogin.__cloudWrapped){
   const wrapped=function(){
    const username=d.getElementById('loginUser')?.value?.trim()||''; const password=d.getElementById('loginPass')?.value||''; const box=d.getElementById('loginErr');
    if(!username||!password)return origLogin.call(w);
    (async()=>{try{const cand=localDb();const x=await cloudLogin(username,password,cand);cloudToken=x.token||'';if(!cloudToken)throw new Error('بيانات الدخول غير صحيحة');localStorage.setItem(CLOUD_TOKEN_KEY,cloudToken);if(x.snapshot){localStorage.setItem(DB_KEY,x.snapshot);if(x.userId!==undefined)localStorage.setItem(APP_SESSION_KEY,String(x.userId));location.reload();return}origLogin.call(w);const s=localDb();if(s)queueSave(s)}catch(e){if(box){box.textContent=e.message||'تعذر الاتصال بالسحابة';box.classList.remove('hidden')}}})()
   }; wrapped.__cloudWrapped=true; w.login=wrapped;
 }
 const origRec=w.recoverLoginCredentials;
 if(typeof origRec==='function'&&!origRec.__cloudWrapped){
  const wrapped=function(){const code=d.getElementById('loginRecoveryId')?.value?.trim()||'';if(!code)return origRec.call(w);(async()=>{try{const x=await api('/api/cloud/recover',{recoveryCode:code});if(x.useLocal)return origRec.call(w);const res=d.getElementById('loginRecoveryResult');if(!x.ok){if(res){res.classList.remove('hidden');res.classList.add('error');res.textContent=x.message||'رقم الاسترداد غير صحيح'}return}if(res){res.classList.remove('hidden','error');res.innerHTML='<div style="font-weight:800;margin-bottom:6px">بيانات الدخول الخاصة بك</div><div><b>اسم المستخدم:</b> '+String(x.username||'')+'</div><div><b>كلمة المرور:</b> '+String(x.password||'')+'</div>'}}catch{origRec.call(w)}})()};wrapped.__cloudWrapped=true;w.recoverLoginCredentials=wrapped;
 }
 const origLogout=w.logout;
 if(typeof origLogout==='function'&&!origLogout.__cloudWrapped){const wrapped=function(){localStorage.removeItem(CLOUD_TOKEN_KEY);cloudToken='';return origLogout.call(w)};wrapped.__cloudWrapped=true;w.logout=wrapped}
}
async function boot(){
 try{await restoreBeforeBoot();frame.addEventListener('load',()=>{loading.style.display='none';frame.style.display='block';installBridge()},{once:true});frame.src='/app.html'}
 catch(e){err.style.display='block';err.textContent='تعذر تشغيل البرنامج: '+(e.message||e)}
}
boot();
})();
</script>
</body>
</html>
