function saveOwner(id){
 if(id&&!requireManager())return;
 const name=document.getElementById('f_name')?.value.trim();
 const phone=document.getElementById('f_phone')?.value.trim();
 const nationalId=document.getElementById('f_nid')?.value.trim();
 const email=document.getElementById('f_email')?.value.trim()||'';
 const address=document.getElementById('f_address')?.value.trim()||'';
 const bankName=document.getElementById('f_bankName')?.value.trim()||'';
 const bankAccount=document.getElementById('f_bankAccount')?.value.trim()||'';
 const iban=document.getElementById('f_iban')?.value.trim()||'';
 const notes=document.getElementById('f_notes')?.value.trim()||'';
 if(!name){flash('أدخل اسم المالك');return}
 if(!phone){flash('أدخل رقم تليفون / جوال المالك');return}
 if(!nationalId){flash('أدخل رقم هوية المالك');return}

 const duplicateNid=db.owners.find(x=>String(x.nationalId||'').trim()===nationalId && String(x.id)!==String(id||''));
 if(duplicateNid){flash('رقم الهوية مسجل لمالك آخر');return}

 const isEdit=!!id;
 const o=id?db.owners.find(x=>x.id==id):{id:uid(),code:generateOwnerCode(),createdAt:nowStamp()};
 if(!o)return;
 Object.assign(o,{name,phone,nationalId,email,address,bankName,bankAccount,iban,notes,updatedAt:nowStamp()});
 if(!id)db.owners.push(o);

 save();
 audit(isEdit?'تعديل مالك':'إضافة مالك','إدارة الملاك',o.code,o.name);
 renderOwners();
 flash(isEdit?'تم حفظ تعديل المالك':`تمت إضافة المالك بالكود ${o.code}`);
}
function saveProperty(id){
 if(id&&!requireManager())return;
 const name=document.getElementById('f_name')?.value.trim();
 const type=document.getElementById('f_type')?.value;
 if(!name){flash('أدخل اسم العقار');return}
 if(!type){flash('اختر نوع العقار من الإعدادات العامة ← أنواع العقارات');return}
 if(!pendingPropertyOwners.length){flash('حدد مالكًا واحدًا على الأقل للعقار');return}
 const ownerIds=pendingPropertyOwners.map(x=>String(x.ownerId));
 if(new Set(ownerIds).size!==ownerIds.length){flash('لا يمكن تكرار نفس المالك في العقار');return}
 const total=pendingPropertyOwners.reduce((s,x)=>s+Number(x.share||0),0);
 if(Math.abs(total-100)>.001){flash('مجموع نسب ملكية العقار يجب أن يساوي 100%');return}
 const isEdit=!!id;
 const o=id?db.properties.find(x=>x.id==id):{id:uid(),code:generatePropertyCode()};
 if(!o)return;
 const unitCount=Math.max(0,Number(document.getElementById('f_unitCount')?.value||0));
 Object.assign(o,{
  name,type,
  ownerId:Number(pendingPropertyOwners[0].ownerId)||null,
  owners:pendingPropertyOwners.map(x=>({ownerId:Number(x.ownerId),share:Number(x.share||0)})),
  countryId:Number(document.getElementById('f_country')?.value)||null,
  regionId:Number(document.getElementById('f_region')?.value)||null,
  cityId:Number(document.getElementById('f_city')?.value)||null,
  district:document.getElementById('f_district')?.value.trim()||'',
  street:document.getElementById('f_street')?.value.trim()||'',
  address:document.getElementById('f_address')?.value.trim()||'',
  area:Number(document.getElementById('f_area')?.value||0),
  waterMeter:document.getElementById('f_waterMeter')?.value.trim()||'',
  propertyAmount:Number(document.getElementById('f_propertyAmount')?.value||0),
  unitCount,
  autoManagementDeduction:document.getElementById('f_autoMgmt')?.value==='yes',
  managementRate:Number(document.getElementById('f_mgmtRate')?.value||0),
  bankAccount:document.getElementById('f_bankAccount')?.value.trim()||'',
  deedNo:document.getElementById('f_deedNo')?.value.trim()||'',
  deedDate:document.getElementById('f_deedDate')?.value||'',
  licenseNo:document.getElementById('f_licenseNo')?.value.trim()||'',
  licenseDate:document.getElementById('f_licenseDate')?.value||'',
  licensePlace:document.getElementById('f_licensePlace')?.value.trim()||'',
  notes:document.getElementById('f_notes')?.value.trim()||'',
  deedImage:pendingPropertyImages.deedImage||'',
  propertyImage:pendingPropertyImages.propertyImage||'',
  pendingUnits:pendingPropertyUnits.slice(0,unitCount).map(x=>({...x}))
 });
 if(!id)db.properties.push(o);

 // إنشاء/تحديث الوحدات المُدخلة من شاشة عدد الوحدات بدون توزيع مبلغ العقار عليها
 o.pendingUnits.forEach((u,idx)=>{
  let unit=db.units.find(x=>x.propertyId==o.id && x.generatedFromProperty && x.propertyUnitIndex===idx);
  if(!unit){unit={id:uid(),code:u.code||makePropertyUnitCode(o.code,idx),propertyId:o.id,generatedFromProperty:true,propertyUnitIndex:idx};db.units.push(unit)}
  if(!unit.code || unit.generatedFromProperty) unit.code=u.code||makePropertyUnitCode(o.code,idx);
  Object.assign(unit,{
   code:u.code||makePropertyUnitCode(o.code,idx),type:u.type||'',description:u.description||'',purpose:u.purpose||'',
   rooms:Number(u.rooms||0),area:Number(u.area||0),electricMeter:u.electricMeter||'',
   rent:Number(u.rent||0),
   waterMode:u.waterMode||'amount',water:Number(u.water||0),waterAmount:unitChargeAmount(u,'waterMode','water'),
   depositMode:u.depositMode||'amount',deposit:Number(u.deposit||0),depositAmount:unitChargeAmount(u,'depositMode','deposit'),
   ownerShareMode:u.ownerShareMode||'amount',ownerShare:Number(u.ownerShare||0),ownerShareAmount:unitChargeAmount(u,'ownerShareMode','ownerShare'),
   tenantChargeMode:u.tenantChargeMode||'amount',tenantCharge:Number(u.tenantCharge||0),tenantChargeAmount:unitChargeAmount(u,'tenantChargeMode','tenantCharge'),
   servicesMode:u.servicesMode||'amount',services:Number(u.services||0),servicesAmount:unitChargeAmount(u,'servicesMode','services'),
   discountMode:u.discountMode||'amount',discount:Number(u.discount||0),discountAmount:unitChargeAmount(u,'discountMode','discount'),
   net:Number(u.net||0),totalAfter:Number(u.totalAfter||0),
   status:unit.status||'شاغرة'
  });
 });
 // حذف الوحدات الآلية الزائدة فقط عند تقليل العدد

function rebuildContractPayments(contractId){
 if(!Array.isArray(db.installments))db.installments=[];
 if(!Array.isArray(db.payments))db.payments=[];
 const inst=db.installments.filter(i=>String(i.contractId)===String(contractId)).sort((a,b)=>String(a.dueDate||'').localeCompare(String(b.dueDate||'')));
 inst.forEach(i=>{i.paid=0;i.status='مستحق'});
 db.payments.filter(p=>String(p.contractId)===String(contractId)&&p.installmentId).forEach(p=>{
  const i=inst.find(x=>String(x.id)===String(p.installmentId));if(!i)return;
  i.paid=Math.min(Number(i.amount||0),Number(i.paid||0)+Number(p.amount||0));
 });
 db.payments.filter(p=>String(p.contractId)===String(contractId)&&!p.installmentId).sort((a,b)=>String(a.date||'').localeCompare(String(b.date||''))).forEach(p=>{
  let remain=Number(p.amount||0);inst.forEach(i=>{if(remain<=0)return;const due=Math.max(0,Number(i.amount||0)-Number(i.paid||0)),use=Math.min(remain,due);i.paid=Number(i.paid||0)+use;remain-=use});
 });
 inst.forEach(i=>{i.status=Number(i.paid||0)>=Number(i.amount||0)?'مدفوع':Number(i.paid||0)>0?'جزئي':'مستحق'});
}

// ===== Universal sorting for every visible data table =====
function normalizeSortDigits(value){
 return String(value??'')
  .replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d))
  .replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
}
function globalSortText(cell){
 const clone=cell?.cloneNode?.(true);if(!clone)return '';
 clone.querySelectorAll('button,input,select,textarea,svg').forEach(x=>x.remove());
 return normalizeSortDigits((clone.textContent||'').replace(/\s+/g,' ').trim());
}
function globalSortNumber(value){
 const s=normalizeSortDigits(value).replace(/[٬,،\s]/g,'').replace(/[%٪]/g,'');
 const m=s.match(/[-+]?\d+(?:\.\d+)?/);return m?Number(m[0]):NaN;
}
function globalSortDate(value){
 const s=normalizeSortDigits(value).trim();
 let m=s.match(/\b(19\d{2}|20\d{2})[-\/.](\d{1,2})[-\/.](\d{1,2})\b/);
 if(m)return new Date(Number(m[1]),Number(m[2])-1,Number(m[3])).getTime();
 m=s.match(/\b(\d{1,2})[-\/.](\d{1,2})[-\/.](19\d{2}|20\d{2})\b/);
 if(m)return new Date(Number(m[3]),Number(m[2])-1,Number(m[1])).getTime();
 const t=Date.parse(s);return Number.isFinite(t)?t:NaN;
}
function globalSortKind(values,header=''){
 const h=String(header||'');
 if(/تاريخ|الاستحقاق|date/i.test(h))return 'date';
 if(/مبلغ|قيمة|إجمالي|اجمالي|رصيد|مدفوع|متبقي|المتبقي|إيراد|ايراد|مصروف|ضريبة|عمولة|نسبة|كمية|عدد|رقم|م$|#|مساحة|سعر/i.test(h))return 'number';
 const useful=values.map(x=>String(x||'').trim()).filter(Boolean).slice(0,60);if(!useful.length)return 'text';
 const dates=useful.filter(x=>Number.isFinite(globalSortDate(x))).length;
 if(dates/useful.length>=.7)return 'date';
 const nums=useful.filter(x=>Number.isFinite(globalSortNumber(x))).length;
 if(nums/useful.length>=.8)return 'number';
 return 'text';
}
function decorateGlobalSortableTables(root=document){
 root.querySelectorAll('table').forEach(table=>{
  const headRows=table.tHead?.rows?.length?Array.from(table.tHead.rows):[];
  const row=headRows[headRows.length-1]||Array.from(table.rows||[]).find(r=>r.querySelector('th'));
  if(!row)return;
  Array.from(row.cells||[]).forEach((th,index)=>{
   if(th.tagName!=='TH')return;
   const label=(th.textContent||'').trim();
   if(/^(الإجراء|الإجراءات|اجراء|اجراءات)$/i.test(label))return;
   th.classList.add('global-sortable');
   th.dataset.sortIndex=String(index);
   if(!th.getAttribute('title'))th.setAttribute('title','اضغط للترتيب تصاعديًا أو تنازليًا');
   th.setAttribute('aria-sort',th.classList.contains('sort-asc')?'ascending':th.classList.contains('sort-desc')?'descending':'none');
  });
 });
}
function sortGlobalTableByHeader(th){
 const table=th.closest('table');if(!table)return;
 const index=Number(th.dataset.sortIndex);if(!Number.isInteger(index))return;
 const nextDir=th.classList.contains('sort-asc')?'desc':'asc';
 table.querySelectorAll('th.global-sortable').forEach(h=>{h.classList.remove('sort-asc','sort-desc');h.setAttribute('aria-sort','none')});
 th.classList.add(nextDir==='asc'?'sort-asc':'sort-desc');th.setAttribute('aria-sort',nextDir==='asc'?'ascending':'descending');
 const collator=new Intl.Collator('ar',{numeric:true,sensitivity:'base',ignorePunctuation:true});
 const targets=table.tBodies?.length?Array.from(table.tBodies):[table];
 targets.forEach(body=>{

   }else if(kind==='number'){
