[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/cloud/*"
  to = "/.netlify/functions/cloud/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
